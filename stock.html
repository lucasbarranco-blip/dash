<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock · Ganga Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F5; --card:#FFFFFF; --ink:#333333; --ink2:#666666; --ink3:#999999;
  --line:#EEEEEE; --line2:#DDDDDD;
  --ok:#00A650; --okbg:#EAF7EF; --warn:#A87900; --warnbg:#FFF6DE;
  --bad:#E8590C; --badbg:#FDEFE6; --crit:#F23D4F; --critbg:#FFF0F0;
  --acc:#3483FA; --accbg:#EBF3FE; --ml:#FFF159; --sh:0 1px 2px rgba(0,0,0,.1);
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--ml);display:flex;align-items:center;justify-content:center;font-weight:700;color:#333;font-size:15px;box-shadow:var(--sh)}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.2px}
.brand .sub{font-size:12px;color:var(--ink2);font-weight:500}
.updated{margin-left:auto;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.tile .lbl{font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:6px}
.tile .val{font-size:26px;font-weight:700;letter-spacing:-.5px}
.tile.acc .val{color:var(--acc)} .tile.ok .val{color:var(--ok)} .tile.crit .val{color:var(--crit)} .tile.warn .val{color:var(--warn)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:14px;background:var(--card)}
.search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.search svg{position:absolute;left:11px;top:11px;color:var(--ink3)}
.chip{padding:8px 12px;border:1px solid var(--line2);background:var(--card);border-radius:10px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--accbg);border-color:#B9D4FC;color:var(--acc)}
.chip.on.crit{background:var(--critbg);border-color:#F5B5BC;color:var(--crit)}
.chip:hover{border-color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:11px 14px;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;background:#FAFAFA;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
thead th.num{text-align:right}
thead th .ar{color:var(--acc);font-size:10px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FBFBFB}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sku{font-weight:600;color:var(--ink);white-space:nowrap}
.prod{color:var(--ink);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q0{color:var(--crit)} .qlow{color:var(--bad)}
.tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.tag-out{background:var(--critbg);color:var(--crit)}
.tag-low{background:var(--badbg);color:var(--bad)}
.tag-ok{background:var(--okbg);color:var(--ok)}
.st-active{background:var(--okbg);color:var(--ok)}
.st-paused{background:#F0F0F0;color:var(--ink2)}
.st-review{background:var(--warnbg);color:var(--warn)}
.lnk{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--acc);color:var(--acc);border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.lnk:hover{background:var(--accbg)}
.lnk svg{width:12px;height:12px}
.empty{padding:50px 20px;text-align:center;color:var(--ink3)}
.foot{margin-top:16px;font-size:12px;color:var(--ink3);text-align:center;line-height:1.7}
.foot b{color:var(--ink2)}
@media(max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}.prod{max-width:150px}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">GH</div>
      <div>
        <h1>Stock Full</h1>
        <div class="sub">Ganga Home · Mercado Libre</div>
      </div>
    </div>
    <div class="updated" id="updated"><span class="dot"></span> Cargando…</div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="lbl">Publicaciones en Full</div><div class="val" id="t-act">–</div></div>
    <div class="tile ok"><div class="lbl">Unidades en Full</div><div class="val" id="t-stock">–</div></div>
    <div class="tile crit"><div class="lbl">Sin stock</div><div class="val" id="t-out">–</div></div>
    <div class="tile warn"><div class="lbl">Pausadas</div><div class="val" id="t-paused">–</div></div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Buscar por SKU o producto…">
    </div>
    <button class="chip on" id="f-act">Solo activas</button>
    <button class="chip crit" id="f-out">Solo sin stock</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th data-k="sku">SKU <span class="ar" id="ar-sku"></span></th>
          <th data-k="producto">Producto <span class="ar" id="ar-producto"></span></th>
          <th data-k="stock" class="num">Stock <span class="ar" id="ar-stock"></span></th>
          <th data-k="vendidos" class="num hide-sm">Vendidos <span class="ar" id="ar-vendidos"></span></th>
          <th data-k="estado">Estado</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No hay resultados.</div>
  </div>

  <div class="foot">
    <span id="foot-count"></span><br>
    <b>Ganga Home</b> · Vista de solo lectura · se actualiza sola con cada sincronización de Mercado Libre.
  </div>
</div>

<script>
// ====== Conexión a Supabase (la anon key es pública por diseño) ======
const SB = {
  url: 'https://slfmkdtsksjatcfcfvgl.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsZm1rZHRza3NqYXRjZmNmdmdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDMzNzgsImV4cCI6MjA5NTkxOTM3OH0.uKRquNgMXvLo2ZYGWm1ZE2WOwjeYDk_zo4cd92J2rXc',
  table: 'productos'
};

let DATA = [], updatedAt = null;
let sortKey = 'stock', sortDir = 1;
let onlyActive = true, onlyOut = false, query = '';

const fmt = n => (n==null||isNaN(n)) ? '0' : Math.round(n).toLocaleString('es-AR');
const norm = s => (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  try{
    const url = `${SB.url}/rest/v1/${SB.table}?select=sku,titulo,stock,vendidos,estado,permalink,actualizado_en&limit=5000`;
    const res = await fetch(url, { headers: { apikey: SB.key, Authorization: 'Bearer ' + SB.key } });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    DATA = rows.map(r => ({
      sku: (r.sku||'').trim(),
      producto: (r.titulo||'').trim(),
      stock: Number(r.stock)||0,
      vendidos: Number(r.vendidos)||0,
      estado: r.estado||'',
      link: r.permalink||''
    }));
    updatedAt = rows.reduce((m,r)=> (r.actualizado_en>m? r.actualizado_en : m), '');
    render();
  }catch(e){
    document.getElementById('updated').innerHTML = '<span style="color:var(--crit)">No pude cargar los datos ('+esc(e.message)+')</span>';
    document.getElementById('empty').style.display='block';
    document.getElementById('empty').textContent='No se pudieron cargar los datos de Supabase.';
  }
}

function setUpdated(){
  const el = document.getElementById('updated');
  let txt = 'Actualizado';
  if(updatedAt){ const d = new Date(updatedAt); if(!isNaN(d)) txt = 'Actualizado ' + d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) + ' hs'; }
  el.innerHTML = '<span class="dot"></span> ' + txt;
}

function estadoTag(e){
  if(e==='active') return '<span class="tag st-active">Activa</span>';
  if(e==='paused') return '<span class="tag st-paused">Pausada</span>';
  if(e==='under_review') return '<span class="tag st-review">En revisión</span>';
  return '<span class="tag st-paused">'+esc(e||'—')+'</span>';
}
function stockTag(s){
  if(s<=0) return '<span class="tag tag-out">Sin stock</span>';
  if(s<=5) return '<span class="tag tag-low">Bajo</span>';
  return '<span class="tag tag-ok">OK</span>';
}

function render(){
  const activas = DATA.filter(x=>x.estado==='active');
  document.getElementById('t-act').textContent = fmt(activas.length);
  document.getElementById('t-stock').textContent = fmt(activas.reduce((a,b)=>a+b.stock,0));
  document.getElementById('t-out').textContent = fmt(activas.filter(x=>x.stock<=0).length);
  document.getElementById('t-paused').textContent = fmt(DATA.filter(x=>x.estado==='paused').length);
  setUpdated();

  let rows = DATA.slice();
  if(onlyActive) rows = rows.filter(x=>x.estado==='active');
  if(onlyOut) rows = rows.filter(x=>x.stock<=0);
  if(query){ const q=norm(query); rows = rows.filter(x=>norm(x.sku).includes(q)||norm(x.producto).includes(q)); }
  rows.sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(typeof va==='string'){ va=norm(va); vb=norm(vb); return va<vb?-sortDir:va>vb?sortDir:0; }
    return (va-vb)*sortDir;
  });
  ['sku','producto','stock','vendidos'].forEach(k=>{ const el=document.getElementById('ar-'+k); if(el) el.textContent=(sortKey===k)?(sortDir===1?'▲':'▼'):''; });

  document.getElementById('rows').innerHTML = rows.map(it=>{
    const qcls = it.stock<=0?'q0':(it.stock<=5?'qlow':'');
    return `<tr>
      <td class="sku">${esc(it.sku||'—')}</td>
      <td class="prod" title="${esc(it.producto)}">${esc(it.producto)}</td>
      <td class="num ${qcls}">${fmt(it.stock)} &nbsp;${stockTag(it.stock)}</td>
      <td class="num hide-sm">${fmt(it.vendidos)}</td>
      <td>${estadoTag(it.estado)}</td>
      <td>${it.link?`<a class="lnk" href="${esc(it.link)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>Ver</a>`:'—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('empty').style.display = rows.length?'none':'block';
  document.getElementById('foot-count').textContent = `Mostrando ${rows.length} publicaciones` + (onlyActive?' activas':'') + ` de ${DATA.length} totales`;
}

document.querySelectorAll('thead th[data-k]').forEach(th=>{
  const k=th.dataset.k; if(!['sku','producto','stock','vendidos'].includes(k)) return;
  th.addEventListener('click',()=>{ if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;} render(); });
});
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value; render(); });
document.getElementById('f-act').addEventListener('click',e=>{ onlyActive=!onlyActive; e.target.classList.toggle('on',onlyActive); render(); });
document.getElementById('f-out').addEventListener('click',e=>{ onlyOut=!onlyOut; e.target.classList.toggle('on',onlyOut); render(); });

load();
</script>
</body>
</html>
