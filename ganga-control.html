    ]));

    const g=el('div','grid g2');
    const c1=chartBox('Evolución de ingresos','Por día · '+fDateL(r.desde)+' a '+fDateL(r.hasta));
    g.appendChild(c1.card);
    const c2=chartBox('Unidades y pedidos por día');
    g.appendChild(c2.card);
    view.appendChild(g);
    const lab=cur.map(x=>fDate(x.fecha));
    setTimeout(()=>{
      lineChart(c1,lab,[{label:'Ingresos',data:cur.map(x=>x.ingresos),color:PAL[0],fill:true},
        ...(mar>0?[{label:'Margen ML',data:cur.map(x=>x.margen),color:PAL[2]}]:[])]);
      barChart(c2,lab,[{label:'Unidades',data:cur.map(x=>x.unidades),color:PAL[1]},
        ...(ped>0?[{label:'Pedidos',data:cur.map(x=>x.pedidos),color:PAL[6]}]:[])],{money:false,fmt:fN});
    },0);

    const g2=el('div','grid g2');
    if(P.length){
      const pRows=Array.from(sumBy(P.filter(x=>!r.desde||x.mes<=r.hasta),x=>x.provincia,['unidades']).values()).sort((a,b)=>b.unidades-a.unidades);
      const b1=chartBox('Ventas por provincia','Unidades acumuladas · top 12');
      g2.appendChild(b1.card);
      setTimeout(()=>barChart(b1,pRows.slice(0,12).map(x=>x._k),[{label:'Unidades',data:pRows.slice(0,12).map(x=>x.unidades),color:PAL[0]}],{horizontal:true,money:false,fmt:fN}),0);
    }
    if(PR.length){
      const prRows=Array.from(sumBy(PR,x=>x.producto,['unidades']).values()).sort((a,b)=>b.unidades-a.unidades);
      const b2=chartBox('Productos más vendidos','Unidades acumuladas · top 12');
      g2.appendChild(b2.card);
      setTimeout(()=>barChart(b2,prRows.slice(0,12).map(x=>x._k.slice(0,38)),[{label:'Unidades',data:prRows.slice(0,12).map(x=>x.unidades),color:PAL[2]}],{horizontal:true,money:false,fmt:fN}),0);
    }
    if(g2.children.length) view.appendChild(g2);

    // evolución mensual
    const meses=Array.from(sumBy(V,x=>x.fecha.slice(0,7),['ingresos','unidades','pedidos','margen']).values()).sort((a,b)=>a._k<b._k?-1:1);
    if(meses.length>1){
      const cm=chartBox('Evolución mensual','Ingresos y unidades por mes',240);
      view.appendChild(cm.card);
      setTimeout(()=>barChart(cm,meses.map(m=>MESN[+m._k.slice(5)-1]+' '+m._k.slice(2,4)),[{label:'Ingresos',data:meses.map(m=>m.ingresos),color:PAL[0]}]),0);
      view.appendChild(dataTable({id:'res_mes',title:'Resumen por mes',cols:[
        {k:'mes',l:'Mes'},{k:'dias',l:'Días',t:'num'},{k:'ingresos',l:'Ingresos',t:'money',total:'sum'},
        {k:'margen',l:'Margen ML',t:'money',total:'sum'},{k:'mpct',l:'% Margen',t:'pct'},
        {k:'unidades',l:'Unidades',t:'num',total:'sum'},{k:'pedidos',l:'Pedidos',t:'num',total:'sum'},
        {k:'ticket',l:'Ticket x unidad',t:'money'},{k:'ticketC',l:'Ticket x compra',t:'money'},{k:'ingdia',l:'Ingresos/día',t:'money'}
      ],rows:meses.map(m=>({mes:MESN[+m._k.slice(5)-1]+' '+m._k.slice(0,4),dias:m._n,ingresos:m.ingresos,margen:m.margen,
        mpct:div(m.margen,m.ingresos),unidades:m.unidades,pedidos:m.pedidos,ticket:div(m.ingresos,m.unidades),
        ticketC:div(m.ingresos,m.pedidos||m.unidades),ingdia:div(m.ingresos,m._n)})),
        sort:{k:'mes',dir:'asc'},search:false,totals:true,csvName:'resumen_mensual'}));
    }
    if(V.some(x=>x.pedidos>x.unidades)) view.appendChild(el('div','note','ℹ️ En el reporte de ML las columnas vienen cruzadas (“Ventas” trae unidades y “Unidades vendidas” trae pedidos). La app lo interpreta así: <b>Unidades</b> = columna Ventas, <b>Pedidos</b> = columna Unidades vendidas.'));
  }

  if(tabs.cur==='evo'){
    const rows=cur.map(x=>({...x,mpct:div(x.margen,x.ingresos),ticket:div(x.ingresos,x.unidades),ticketC:div(x.ingresos,x.pedidos||x.unidades),
      dia:DIAS[isoToDate(x.fecha).getDay()]}));
    const c1=chartBox('Ticket promedio por día','Ingresos ÷ unidades vendidas, y también por compra');
    view.appendChild(c1.card);
    setTimeout(()=>lineChart(c1,rows.map(x=>fDate(x.fecha)),[
      {label:'Por unidad',data:rows.map(x=>x.ticket),color:PAL[3]},
      {label:'Por compra',data:rows.map(x=>x.ticketC),color:PAL[0]}]),0);
    view.appendChild(dataTable({id:'res_dia',title:'Ventas por día',sub:'Ordená por cualquier columna haciendo clic en el encabezado',
      cols:[{k:'fecha',l:'Fecha',t:'date'},{k:'dia',l:'Día'},{k:'ingresos',l:'Ingresos',t:'money',total:'sum'},
        {k:'margen',l:'Margen ML',t:'money',total:'sum'},{k:'mpct',l:'% Margen',t:'pct',total:'avg'},
        {k:'unidades',l:'Unidades',t:'num',total:'sum'},{k:'pedidos',l:'Pedidos',t:'num',total:'sum'},
        {k:'ticket',l:'Ticket x unidad',t:'money',total:'avg'},{k:'ticketC',l:'Ticket x compra',t:'money',total:'avg'}],
      rows,sort:{k:'fecha',dir:'desc'},totals:true,searchKeys:['fecha','dia'],csvName:'ventas_por_dia'}));
  }

  if(tabs.cur==='geo'){
    if(!P.length){ view.appendChild(card(null,null,'<div class="empty">No hay datos de provincias cargados.</div>')); return view; }
    const mesesDisp=Array.from(new Set(P.map(x=>x.mes))).sort();
    const selMes=UI.filters.geoMes||'';
    const rows=Array.from(sumBy(selMes?P.filter(x=>x.mes===selMes):P,x=>x.provincia,['unidades']).values()).sort((a,b)=>b.unidades-a.unidades);
    const tot=sum(rows,x=>x.unidades);
    const c=chartBox('Distribución geográfica','Unidades por provincia'+(selMes?' · '+MESN[+selMes.slice(5)-1]:' · todos los meses'),Math.max(280,rows.length*17));
    view.appendChild(c.card);
    setTimeout(()=>barChart(c,rows.map(x=>x._k),[{label:'Unidades',data:rows.map(x=>x.unidades),color:PAL[0]}],{horizontal:true,money:false,fmt:fN,thick:15}),0);
    const maxU=Math.max(1,...rows.map(x=>x.unidades));
    const detalle=Array.from(sumBy(P,x=>x.provincia+'||'+x.mes,['unidades']).values()).map(x=>{
      const [pv,ms]=x._k.split('||');
      return {provincia:pv,mesL:ms?MESN[+ms.slice(5)-1]+' '+ms.slice(0,4):'',unidades:x.unidades,share:div(x.unidades,tot)};
    });
    view.appendChild(dataTable({id:'res_geo_ag',title:'Provincias · consolidado',
      cols:[{k:'provincia',l:'Provincia'},{k:'unidades',l:'Unidades',t:'num',total:'sum'},
        {k:'share',l:'% del total',t:'pct',render:r=>`<span class="mini-bar-bg"><span class="mini-bar" style="width:${(r.unidades/maxU*100).toFixed(1)}%"></span></span>${fP(r.share)}`}],
      rows:rows.map(x=>({provincia:x._k,unidades:x.unidades,share:div(x.unidades,tot)})),
      sort:{k:'unidades',dir:'desc'},totals:true,csvName:'ventas_por_provincia'}));
    if(mesesDisp.length>1) view.appendChild(dataTable({id:'res_geo',title:'Provincias · mes por mes',
      filters:[{k:'mesL',label:'Mes',options:mesesDisp.map(m=>MESN[+m.slice(5)-1]+' '+m.slice(0,4))}],
      cols:[{k:'provincia',l:'Provincia'},{k:'mesL',l:'Mes'},{k:'unidades',l:'Unidades',t:'num',total:'sum'},{k:'share',l:'% del total',t:'pct'}],
      rows:detalle,sort:{k:'unidades',dir:'desc'},totals:true,csvName:'provincia_por_mes'}));
  }

  if(tabs.cur==='prod'){
    if(!PR.length){ view.appendChild(card(null,null,'<div class="empty">No hay ranking de productos cargado.</div>')); return view; }
    const porProd=Array.from(sumBy(PR,x=>x.producto,['unidades']).values()).sort((a,b)=>b.unidades-a.unidades);
    const totU=sum(porProd,x=>x.unidades);
    const c=chartBox('Top 15 productos','Unidades vendidas',Math.max(260,15*20));
    view.appendChild(c.card);
    setTimeout(()=>barChart(c,porProd.slice(0,15).map(x=>x._k.slice(0,42)),[{label:'Unidades',data:porProd.slice(0,15).map(x=>x.unidades),color:PAL[2]}],{horizontal:true,money:false,fmt:fN,thick:16}),0);
    view.appendChild(dataTable({id:'res_prod',title:'Productos y variaciones',sub:'Cruzá con Catálogo para ver visitas y conversión',
      cols:[{k:'producto',l:'Producto'},{k:'variacion',l:'Variación'},{k:'mesL',l:'Mes'},
        {k:'unidades',l:'Unidades',t:'num',total:'sum'},{k:'share',l:'% del total',t:'pct'}],
      rows:PR.map(x=>({...x,mesL:x.mes?MESN[+x.mes.slice(5)-1]+' '+x.mes.slice(0,4):'',share:div(x.unidades,totU)})),
      sort:{k:'unidades',dir:'desc'},totals:true,csvName:'top_productos'}));
    view.appendChild(dataTable({id:'res_prod_ag',title:'Consolidado por producto',
      cols:[{k:'producto',l:'Producto'},{k:'variantes',l:'Variantes',t:'num'},{k:'unidades',l:'Unidades',t:'num',total:'sum'},{k:'share',l:'% del total',t:'pct'}],
      rows:porProd.map(x=>({producto:x._k,variantes:x._n,unidades:x.unidades,share:div(x.unidades,totU)})),
      sort:{k:'unidades',dir:'desc'},totals:true,csvName:'productos_consolidado'}));
  }

  if(tabs.cur==='sem'){
    const dow=sumBy(cur,x=>isoToDate(x.fecha).getDay(),['ingresos','unidades','pedidos']);
    const orden=[1,2,3,4,5,6,0];
    const rows=orden.map(d=>{ const o=dow.get(d)||{ingresos:0,unidades:0,pedidos:0,_n:0};
      return {dia:DIAS[d],dias:o._n,ingresos:o.ingresos,unidades:o.unidades,pedidos:o.pedidos,
        prom:div(o.ingresos,o._n),promU:div(o.unidades,o._n),ticket:div(o.ingresos,o.unidades)}; });
    const c=chartBox('Ingresos promedio por día de la semana','Sirve para planificar pauta y stock');
    view.appendChild(c.card);
    setTimeout(()=>barChart(c,rows.map(x=>x.dia),[{label:'Ingresos promedio',data:rows.map(x=>x.prom),color:PAL[0]}]),0);
    const c2=chartBox('Unidades promedio por día de la semana');
    view.appendChild(c2.card);
    setTimeout(()=>barChart(c2,rows.map(x=>x.dia),[{label:'Unidades promedio',data:rows.map(x=>x.promU),color:PAL[1]}],{money:false,fmt:fN}),0);
    view.appendChild(dataTable({id:'res_sem',title:'Detalle por día de la semana',search:false,
      cols:[{k:'dia',l:'Día'},{k:'dias',l:'Cant. de días',t:'num'},{k:'ingresos',l:'Ingresos',t:'money',total:'sum'},
        {k:'prom',l:'Promedio/día',t:'money'},{k:'unidades',l:'Unidades',t:'num',total:'sum'},{k:'promU',l:'Unid. prom.',t:'num'},{k:'ticket',l:'Ticket x unidad',t:'money'}],
      rows,sort:{k:'ingresos',dir:'desc'},totals:true,csvName:'por_dia_semana'}));
  }
  return view;
}

   SECTOR 2 · ATENCIÓN AL CLIENTE
   ========================================================================= */
function rangoDatos(rows,campo){
  const f=rows.map(x=>campo?x[campo]:x.fecha).filter(Boolean).sort();
  return f.length? {min:f[0],max:f[f.length-1]} : null;
}
/* Aviso claro cuando el período elegido cae fuera de lo que hay cargado */
function avisoPeriodo(nombre,todas,enPeriodo,r){
  const rg=rangoDatos(todas);
  const w=el('div','card');
  w.innerHTML=`<div class="empty"><div class="big">📭</div>
    <h4>No hay ${esc(nombre)} entre el ${fDateL(r.desde)} y el ${fDateL(r.hasta)}</h4>
    <p>${rg? `La base cargada va del <b>${fDateL(rg.min)}</b> al <b>${fDateL(rg.max)}</b> (${fN(todas.length)} registros).
        Si necesitás un período posterior, cargá el Excel actualizado con esas filas.`
       : 'Todavía no hay datos cargados para esta sección.'}</p></div>`;
  const b=el('div','card-body'); b.style.textAlign='center'; b.style.paddingTop='0';
  if(rg){
    const btn=el('button','btn','Ver todo el período cargado');
    btn.onclick=()=>{ UI.period={preset:'custom',desde:rg.min,hasta:rg.max}; render(); };
    b.appendChild(btn);
  }
  const btn2=el('button','btn accent','⬆️ Cargar Excel'); btn2.onclick=()=>$('#filePick').click();
  btn2.style.marginLeft='8px'; b.appendChild(btn2);
  w.appendChild(b);
  return w;
}
function marcarAccion(fila,hecho){
  const rows=rowsOf('acciones');
  const clave=(DATASETS.acciones.key)(fila);
  const t=rows.find(x=>(DATASETS.acciones.key)(x)===clave);
  if(!t) return;
  t.hecho=!!hecho; t.hechoPor=hecho?(DB.meta.user||'—'):''; t.hechoTs=hecho?Date.now():0;
  DB.datasets.acciones.ts=Date.now();
  saveLocal();
  if(SB.on) push('acciones').catch(e=>toast('No se pudo compartir el cambio: '+e.message,true));
}

function viewAtencion(){
  const Q=rowsOf('preguntas'), C=rowsOf('postventa'), AC=rowsOf('acciones');
  const view=el('div');
  view.appendChild(uploadStrip('atencion'));
  if(!Q.length&&!C.length&&!AC.length){ view.appendChild(emptyState('atencion','Cargá <b>Resultados ML.xlsx</b>. Uso las hojas “Base de preguntas” y “Base de Cancelaciones + Reclamos + Devoluciones”.')); return view; }

  const dMax=maxDate(Q)||maxDate(C);
  const r=currentRange(dMax), pr=prevRange(r);
  const tabs=subTabs('atencion',[{id:'preg',nom:'Preguntas'},{id:'hora',nom:'Horarios y respuesta'},{id:'post',nom:'Postventa'},
    ...(AC.length?[{id:'acc',nom:'Plan de acción'}]:[]),{id:'det',nom:'Detalle'}]);
  view.appendChild(filterBar(dMax));
  view.appendChild(tabs.node);

  const rgQ=rangoDatos(Q), rgC=rangoDatos(C);
  if(rgQ||rgC) view.appendChild(el('div','note info',
    `Datos cargados: ${rgQ?`<b>preguntas</b> del ${fDateL(rgQ.min)} al ${fDateL(rgQ.max)}`:'sin preguntas'} · ${rgC?`<b>postventa</b> del ${fDateL(rgC.min)} al ${fDateL(rgC.max)}`:'sin postventa'}. El filtro de período sólo puede mostrar lo que esté dentro de esos rangos.`));

  const q=Q.filter(x=>inRange(x.fecha,r)), qPrev=Q.filter(x=>inRange(x.fecha,pr));
  const c=C.filter(x=>inRange(x.fecha,r)), cPrev=C.filter(x=>inRange(x.fecha,pr));
  const ventas=rowsOf('ventas_dia').filter(x=>inRange(x.fecha,r));
  const pedidos=sum(ventas,x=>x.pedidos)||sum(ventas,x=>x.unidades);

  if(tabs.cur==='preg'){
    if(!q.length){ view.appendChild(avisoPeriodo('preguntas',Q,q,r)); return view; }
    const conv=q.filter(x=>x.compra).length;
    const sinResp=q.filter(x=>norm(x.estado).includes('sin')||norm(x.estado).includes('pendiente')).length;
    const tiempos=q.map(x=>x.seg).filter(x=>x!=null&&x>0);
    const dias=new Set(q.map(x=>x.fecha)).size||1;
    view.appendChild(kpiRow([
      {l:'Preguntas recibidas',ic:'💬',v:fN(q.length),s:`${nf1.format(div(q.length,dias))} por día`,d:delta(q.length,qPrev.length),hl:true},
      {l:'Terminaron en venta',ic:'✅',v:fN(conv),s:fP(div(conv,q.length))+' de conversión',d:delta(div(conv,q.length),div(qPrev.filter(x=>x.compra).length,qPrev.length||1))},
      {l:'Tiempo medio de respuesta',ic:'⏱️',v:fSeg(div(sum(tiempos),tiempos.length)),s:'mediana '+fSeg(median(tiempos)),inv:true},
      {l:'Sin responder',ic:'🔔',v:fN(sinResp),s:sinResp?fP(div(sinResp,q.length))+' del total':'todo respondido',inv:true},
      {l:'Publicaciones consultadas',ic:'🏷️',v:fN(new Set(q.map(x=>x.mla||x.titulo)).size),s:'distintas'},
      pedidos?{l:'Preguntas / pedido',ic:'📈',v:nf2.format(div(q.length,pedidos)),s:'cuánto pregunta la gente antes de comprar',inv:true}:null
    ]));

    const g=el('div','grid g2');
    const c1=chartBox('Preguntas por día','Volumen diario');
    const c2=chartBox('Motivos de consulta','Agrupado por categoría · top 10');
    g.appendChild(c1.card); g.appendChild(c2.card); view.appendChild(g);
    const porDia=Array.from(sumBy(q,x=>x.fecha,['x']).entries()).map(([k,v])=>[k,v._n]).sort((a,b)=>a[0]<b[0]?-1:1);
    const porCat=topN(new Map(Array.from(groupBy(q,x=>x.categoria||'Sin clasificar')).map(([k,v])=>[k,v.length])),10);
    setTimeout(()=>{
      lineChart(c1,porDia.map(x=>fDate(x[0])),[{label:'Preguntas',data:porDia.map(x=>x[1]),color:PAL[0],fill:true}],{money:false,fmt:fN});
      barChart(c2,porCat.map(x=>x[0].slice(0,34)),[{label:'Preguntas',data:porCat.map(x=>x[1]),color:PAL[4]}],{horizontal:true,money:false,fmt:fN,thick:16});
    },0);

    const cats=Array.from(groupBy(q,x=>x.categoria||'Sin clasificar')).map(([k,v])=>({
      categoria:k,preguntas:v.length,ventas:v.filter(x=>x.compra).length,conv:div(v.filter(x=>x.compra).length,v.length),
      seg:div(sum(v.map(x=>x.seg||0)),v.filter(x=>x.seg).length||1),pubs:new Set(v.map(x=>x.mla)).size
    })).sort((a,b)=>b.preguntas-a.preguntas);
    view.appendChild(dataTable({id:'at_cat',title:'Categorías de consulta',sub:'Dónde está la fricción: mucha pregunta y poca conversión = ficha incompleta',
      cols:[{k:'categoria',l:'Categoría'},{k:'preguntas',l:'Preguntas',t:'num',total:'sum'},{k:'ventas',l:'Terminaron en venta',t:'num',total:'sum'},
        {k:'conv',l:'% Conversión',t:'pct',total:'avg'},{k:'pubs',l:'Publicaciones',t:'num'},
        {k:'seg',l:'Tiempo medio resp.',t:'num',render:r=>fSeg(r.seg)}],
      rows:cats,sort:{k:'preguntas',dir:'desc'},totals:true,csvName:'preguntas_por_categoria'}));

    const pubs=Array.from(groupBy(q,x=>x.titulo||x.mla)).map(([k,v])=>({
      titulo:k,mla:v[0].mla?'MLA'+v[0].mla:'',preguntas:v.length,ventas:v.filter(x=>x.compra).length,conv:div(v.filter(x=>x.compra).length,v.length),
      cat:topN(new Map(Array.from(groupBy(v,x=>x.categoria)).map(([a,b])=>[a,b.length])),1).map(x=>x[0])[0]||''
    })).sort((a,b)=>b.preguntas-a.preguntas);
    view.appendChild(dataTable({id:'at_pub',title:'Publicaciones más preguntadas',
      cols:[{k:'titulo',l:'Publicación'},{k:'mla',l:'Nº'},{k:'preguntas',l:'Preguntas',t:'num',total:'sum'},
        {k:'ventas',l:'Ventas',t:'num',total:'sum'},{k:'conv',l:'% Conv.',t:'pct'},{k:'cat',l:'Motivo principal'}],
      rows:pubs,sort:{k:'preguntas',dir:'desc'},totals:true,csvName:'publicaciones_preguntadas'}));

    const alertas=[];
    cats.slice(0,6).forEach(x=>{ if(x.preguntas>=15&&x.conv<div(conv,q.length)*0.6)
      alertas.push({lvl:'warn',t:`“${x.categoria}” genera ${x.preguntas} preguntas y convierte ${fP(x.conv)}`,d:'Muy por debajo del promedio general. Conviene resolverlo en la ficha (tabla de medidas, fotos, descripción) para bajar consultas y ganar ventas.'}); });
    pubs.slice(0,5).forEach(x=>{ if(x.preguntas>=20&&x.conv<0.05)
      alertas.push({lvl:'crit',t:`${x.titulo.slice(0,60)} — ${x.preguntas} preguntas, ${fP(x.conv)} de conversión`,d:'Revisar la publicación: probablemente falte información clave o el precio/envío confunda.'}); });
    const tProm=div(sum(tiempos),tiempos.length);
    if(tProm>3600) alertas.push({lvl:'crit',t:'Tiempo de respuesta alto: '+fSeg(tProm),d:'Mercado Libre premia responder rápido. Objetivo: menos de 30 minutos en horario comercial.'});
    view.appendChild(card('Alertas y oportunidades',null,alertBox(alertas)));
  }

  if(tabs.cur==='hora'){
    if(!q.length){ view.appendChild(avisoPeriodo('preguntas',Q,q,r)); return view; }
    const horas=Array.from({length:24},(_,h)=>({h,n:q.filter(x=>x.hora===h).length,v:q.filter(x=>x.hora===h&&x.compra).length}));
    const dow=Array.from({length:7},(_,d)=>({d,n:q.filter(x=>isoToDate(x.fecha).getDay()===d).length}));
    const c1=chartBox('Preguntas por hora del día','Para cubrir los turnos donde más consultan');
    view.appendChild(c1.card);
    setTimeout(()=>barChart(c1,horas.map(x=>String(x.h).padStart(2,'0')+'h'),[{label:'Preguntas',data:horas.map(x=>x.n),color:PAL[0]}],{money:false,fmt:fN}),0);
    const c2=chartBox('Preguntas por día de la semana');
    view.appendChild(c2.card);
    setTimeout(()=>barChart(c2,[1,2,3,4,5,6,0].map(d=>DIAS[d]),[{label:'Preguntas',data:[1,2,3,4,5,6,0].map(d=>dow[d].n),color:PAL[6]}],{money:false,fmt:fN}),0);
    const buckets=[[0,300,'Menos de 5 min'],[300,1800,'5 a 30 min'],[1800,7200,'30 min a 2 h'],[7200,43200,'2 a 12 h'],[43200,1e9,'Más de 12 h']];
    const bk=buckets.map(([a,b,l])=>({l,n:q.filter(x=>x.seg!=null&&x.seg>=a&&x.seg<b).length}));
    const c3=chartBox('Velocidad de respuesta','Distribución de los tiempos');
    view.appendChild(c3.card);
    setTimeout(()=>barChart(c3,bk.map(x=>x.l),[{label:'Preguntas',data:bk.map(x=>x.n),colors:[ST.good,ST.good,ST.warn,ST.serious,ST.crit]}],{money:false,fmt:fN}),0);
    view.appendChild(dataTable({id:'at_hora',title:'Detalle por hora',search:false,
      cols:[{k:'hora',l:'Hora'},{k:'n',l:'Preguntas',t:'num',total:'sum'},{k:'v',l:'Terminaron en venta',t:'num',total:'sum'},{k:'conv',l:'% Conv.',t:'pct'},{k:'share',l:'% del total',t:'pct'}],
      rows:horas.map(x=>({hora:String(x.h).padStart(2,'0')+':00',n:x.n,v:x.v,conv:div(x.v,x.n),share:div(x.n,q.length)})),
      sort:{k:'n',dir:'desc'},totals:true,csvName:'preguntas_por_hora'}));
  }

  if(tabs.cur==='post'){
    if(!c.length){ view.appendChild(avisoPeriodo('casos de postventa',C,c,r)); return view; }
    /* Mismo criterio que tu Excel: Devoluciones incluye las mediaciones y los cambios;
       Reclamos es el subconjunto que terminó en mediación. */
    const canc=c.filter(x=>x.tipo==='Cancelación');
    const dev=c.filter(x=>x.tipo==='Devolución');
    const rec=dev.filter(x=>x.mediacion);
    const cam=dev.filter(x=>x.etapa==='Cambio de producto');
    const dias=new Set(c.map(x=>x.fecha)).size||1;
    view.appendChild(kpiRow([
      {l:'Casos totales',ic:'⚠️',v:fN(c.length),s:`${nf1.format(div(c.length,dias))} por día`,d:delta(c.length,cPrev.length),inv:true,hl:true},
      {l:'Cancelaciones',ic:'🚫',v:fN(canc.length),s:pedidos?fP(div(canc.length,pedidos))+' de los pedidos':'',inv:true},
      {l:'Devoluciones',ic:'↩️',v:fN(dev.length),s:`incluye ${fN(rec.length)} con reclamo y ${fN(cam.length)} cambios`,inv:true},
      {l:'Reclamos (mediación)',ic:'⚖️',v:fN(rec.length),s:pedidos?fP(div(rec.length,pedidos))+' de los pedidos':'',inv:true},
      {l:'Unidades afectadas',ic:'📦',v:fN(sum(c,x=>x.unidades)),s:'suma de unidades de los casos',inv:true},
      pedidos?{l:'Tasa de devolución',ic:'📉',v:fP(div(dev.length,pedidos)),s:'devoluciones / pedidos del período',inv:true}:null,
      {l:'Productos involucrados',ic:'🏷️',v:fN(new Set(c.map(x=>x.titulo).filter(Boolean)).size)}
    ]));
    view.appendChild(el('div','note info','Los números siguen el mismo criterio que tu Excel de resultados: <b>Devoluciones</b> incluye las que terminaron en mediación y los cambios de producto; <b>Reclamos</b> es ese subconjunto en mediación. Por eso reclamos no se suma aparte al total.'));

    const g=el('div','grid g2');
    const c1=chartBox('Casos por día','Cancelaciones y devoluciones');
    const c2=chartBox('Motivos de cancelación','Lo que informa el comprador · top 10');
    g.appendChild(c1.card); g.appendChild(c2.card); view.appendChild(g);
    const fechas=Array.from(new Set(c.map(x=>x.fecha).filter(Boolean))).sort();
    const motCanc=topN(new Map(Array.from(groupBy(canc,x=>x.motivo||'Motivo no especificado')).map(([k,v])=>[k,v.length])),10);
    setTimeout(()=>{
      barChart(c1,fechas.map(fDate),[{label:'Cancelaciones',data:fechas.map(f=>canc.filter(x=>x.fecha===f).length),color:PAL[7]},
        {label:'Devoluciones',data:fechas.map(f=>dev.filter(x=>x.fecha===f).length),color:PAL[1]}],{stacked:true,money:false,fmt:fN});
      barChart(c2,motCanc.map(x=>x[0].slice(0,34)),[{label:'Cancelaciones',data:motCanc.map(x=>x[1]),color:PAL[7]}],{horizontal:true,money:false,fmt:fN,thick:16});
    },0);

    const etapas=topN(new Map(Array.from(groupBy(dev,x=>x.etapa||'Otra')).map(([k,v])=>[k,v.length])),8);
    const c3=chartBox('En qué terminaron las devoluciones','Mercado Libre no informa el motivo de la devolución, sí el desenlace de cada caso');
    view.appendChild(c3.card);
    setTimeout(()=>barChart(c3,etapas.map(x=>x[0]),[{label:'Devoluciones',data:etapas.map(x=>x[1]),
      colors:etapas.map(x=>/mediac|reclamo/i.test(x[0])?ST.crit:/proceso/i.test(x[0])?ST.warn:/cambio/i.test(x[0])?ST.serious:PAL[1])}],
      {horizontal:true,money:false,fmt:fN,thick:20}),0);

    const prods=Array.from(groupBy(c.filter(x=>x.titulo),x=>x.titulo)).map(([k,v])=>({
      producto:k,total:v.length,canc:v.filter(x=>x.tipo==='Cancelación').length,dev:v.filter(x=>x.tipo==='Devolución').length,
      rec:v.filter(x=>x.mediacion).length,unidades:sum(v,x=>x.unidades),
      motivo:topN(new Map(Array.from(groupBy(v,x=>x.tipo==='Cancelación'?x.motivo:(x.etapa||'Devolución'))).map(([a,b])=>[a,b.length])),1).map(x=>x[0])[0]||''
    })).sort((a,b)=>b.total-a.total);
    view.appendChild(dataTable({id:'at_post_prod',title:'Productos con más casos',sub:'Si un producto concentra devoluciones, revisar ficha, medidas o calidad',
      cols:[{k:'producto',l:'Producto'},{k:'total',l:'Casos',t:'num',total:'sum'},{k:'canc',l:'Cancel.',t:'num',total:'sum'},
        {k:'dev',l:'Devol.',t:'num',total:'sum'},{k:'rec',l:'Con reclamo',t:'num',total:'sum'},{k:'unidades',l:'Unidades',t:'num',total:'sum'},{k:'motivo',l:'Motivo / desenlace principal'}],
      rows:prods,sort:{k:'total',dir:'desc'},totals:true,csvName:'postventa_por_producto'}));

    view.appendChild(dataTable({id:'at_post_mot',title:'Motivos y desenlaces',search:false,
      cols:[{k:'tipo',l:'Tipo'},{k:'motivo',l:'Motivo / desenlace'},{k:'casos',l:'Casos',t:'num',total:'sum'},{k:'share',l:'% del tipo',t:'pct'},{k:'unidades',l:'Unidades',t:'num',total:'sum'}],
      rows:[...Array.from(groupBy(canc,x=>x.motivo||'Motivo no especificado')).map(([k,v])=>({tipo:'Cancelación',motivo:k,casos:v.length,share:div(v.length,canc.length),unidades:sum(v,x=>x.unidades)})),
            ...Array.from(groupBy(dev,x=>x.etapa||'Otra')).map(([k,v])=>({tipo:'Devolución',motivo:k,casos:v.length,share:div(v.length,dev.length),unidades:sum(v,x=>x.unidades)}))],
      sort:{k:'casos',dir:'desc'},totals:true,csvName:'motivos_postventa'}));

    const al=[];
    if(pedidos&&div(dev.length,pedidos)>0.02) al.push({lvl:'crit',t:'Tasa de devolución en '+fP(div(dev.length,pedidos)),d:'Por encima del 2% conviene revisar los productos del ranking de arriba: suele ser un problema de expectativa (medidas/colores) más que de calidad.'});
    prods.slice(0,3).forEach(p=>{ if(p.dev>=8) al.push({lvl:'warn',t:`${p.producto.slice(0,60)} acumula ${p.dev} devoluciones`,d:`Desenlace más frecuente: ${esc(p.motivo||'sin especificar')}. Revisar la publicación y las fotos.`}); });
    if(rec.length&&div(rec.length,dev.length)>0.15) al.push({lvl:'warn',t:'El '+fP(div(rec.length,dev.length))+' de las devoluciones terminó en mediación',d:'Las mediaciones impactan directo en la reputación. Priorizar respuesta en el día.'});
    const motTop=motCanc[0];
    if(motTop&&motTop[1]>=canc.length*0.35) al.push({lvl:'warn',t:`La mayoría de las cancelaciones son por “${motTop[0]}” (${motTop[1]} casos)`,d:'Si es arrepentimiento, suele mejorar con fotos y medidas más claras; si es demora, revisar el tiempo de despacho.'});
    view.appendChild(card('Alertas',null,alertBox(al)));
  }

  if(tabs.cur==='acc'){
    const conAcc=AC.filter(x=>x.accion||x.detalle);
    const hechas=AC.filter(x=>x.hecho);
    view.appendChild(kpiRow([
      {l:'Productos analizados',ic:'🔎',v:fN(AC.length),hl:true},
      {l:'Con acción definida',ic:'📝',v:fN(conAcc.length),s:fP(div(conAcc.length,AC.length))+' del total'},
      {l:'Realizadas',ic:'✅',v:fN(hechas.length),s:conAcc.length?fP(div(hechas.length,conAcc.length))+' de las definidas':''},
      {l:'Pendientes con volumen',ic:'⏳',v:fN(AC.filter(x=>!x.hecho&&x.preguntas>=4).length),s:'4 o más preguntas sin resolver',inv:true}
    ]));
    view.appendChild(el('div','note','Tildá la casilla cuando la acción esté hecha: queda guardada con tu nombre y el resto del equipo la ve al sincronizar.'));
    const t=dataTable({id:'at_acc',title:'Plan de acción por producto',sub:'Lo que detectó el equipo, qué se hizo y qué falta',
      filters:[{k:'estadoL',label:'Estado',options:['Realizado','Pendiente']}],
      cols:[
        {k:'chk',l:'Hecho',render:r=>`<input type="checkbox" class="acc-chk" data-k="${esc((DATASETS.acciones.key)(r))}" ${r.hecho?'checked':''} style="width:16px;height:16px;cursor:pointer">`},
        {k:'producto',l:'Producto'},{k:'preguntas',l:'Preguntas',t:'num',total:'sum'},
        {k:'detalle',l:'Qué preguntan',render:r=>`<span title="${esc(r.detalle)}">${esc(r.detalle||'—')}</span>`},
        {k:'accion',l:'Acción tomada',render:r=>r.accion?`<span title="${esc(r.accion)}">${esc(r.accion)}</span>`:'<span class="pill p-warn">Sin definir</span>'},
        {k:'estadoL',l:'Estado',t:'pill',render:r=>r.hecho?`<span class="pill p-good">Realizado${r.hechoPor?' · '+esc(r.hechoPor):''}</span>`:'<span class="pill p-neutral">Pendiente</span>'},
        {k:'hechoTs',l:'Fecha',t:'num',render:r=>r.hechoTs?fDT(r.hechoTs):'—'}],
      rows:AC.map(x=>({...x,estadoL:x.hecho?'Realizado':'Pendiente'})),
      sort:{k:'preguntas',dir:'desc'},totals:true,searchKeys:['producto','detalle','accion'],csvName:'plan_de_accion'});
    t.addEventListener('change',e=>{
      const chk=e.target.closest('.acc-chk'); if(!chk) return;
      const fila=AC.find(x=>(DATASETS.acciones.key)(x)===chk.dataset.k);
      if(fila){ marcarAccion(fila,chk.checked); toast(chk.checked?'Marcado como realizado':'Marcado como pendiente'); render(); }
    });
    view.appendChild(t);
  }

  if(tabs.cur==='det'){
    if(Q.length) view.appendChild(dataTable({id:'at_q',title:'Preguntas · detalle completo',sub:'Buscá por texto, cliente o publicación. Todas las columnas se ordenan.',
      searchPlaceholder:'Buscar en preguntas, respuestas, clientes…',
      filters:[{k:'categoria',label:'Categoría',options:Array.from(new Set(Q.map(x=>x.categoria))).filter(Boolean).sort()},
               {k:'estado',label:'Estado',options:Array.from(new Set(Q.map(x=>x.estado))).filter(Boolean).sort()},
               {k:'compraL',label:'Venta',options:['Sí','No']}],
      cols:[{k:'fecha',l:'Fecha',t:'date'},{k:'hora',l:'Hora',t:'num',render:r=>String(r.hora).padStart(2,'0')+':00'},
        {k:'titulo',l:'Publicación'},{k:'usuario',l:'Cliente'},{k:'pregunta',l:'Pregunta'},{k:'respuesta',l:'Respuesta'},
        {k:'seg',l:'Tiempo resp.',t:'num',render:r=>fSeg(r.seg)},{k:'categoria',l:'Categoría'},
        {k:'compraL',l:'Venta',t:'pill',render:r=>r.compra?'<span class="pill p-good">Sí</span>':'<span class="pill p-neutral">No</span>'}],
      rows:q.length?q.map(x=>({...x,compraL:x.compra?'Sí':'No'})):Q.map(x=>({...x,compraL:x.compra?'Sí':'No'})),
      sort:{k:'fecha',dir:'desc'},searchKeys:['titulo','usuario','pregunta','respuesta','categoria'],
      note:q.length?'':'Sin datos en el período elegido: se muestra todo lo cargado',csvName:'preguntas_detalle'}));
    if(C.length) view.appendChild(dataTable({id:'at_c',title:'Postventa · detalle completo',
      searchPlaceholder:'Buscar por venta, cliente o producto…',
      filters:[{k:'tipo',label:'Tipo',options:['Cancelación','Devolución']},
               {k:'etapaL',label:'Desenlace',options:Array.from(new Set(C.map(x=>x.etapa).filter(Boolean))).sort()},
               {k:'motivo',label:'Motivo',options:Array.from(new Set(C.map(x=>x.motivo))).filter(Boolean).sort()}],
      cols:[{k:'fecha',l:'Fecha',t:'date'},{k:'venta',l:'# de venta'},
        {k:'tipo',l:'Tipo',t:'pill',render:r=>`<span class="pill ${r.tipo==='Cancelación'?'p-crit':'p-warn'}">${esc(r.tipo)}</span>`},
        {k:'etapaL',l:'Desenlace',t:'pill',render:r=>r.etapa?`<span class="pill ${r.mediacion?'p-crit':'p-neutral'}">${esc(r.etapa)}</span>`:'—'},
        {k:'titulo',l:'Producto'},{k:'unidades',l:'Unid.',t:'num',total:'sum'},{k:'comprador',l:'Cliente'},
        {k:'motivo',l:'Motivo'},{k:'estado',l:'Estado ML'}],
      rows:(c.length?c:C).map(x=>({...x,etapaL:x.etapa||''})),sort:{k:'fecha',dir:'desc'},
      searchKeys:['venta','titulo','comprador','motivo','estado'],totals:true,
      note:c.length?'':'Sin datos en el período elegido: se muestra todo lo cargado',csvName:'postventa_detalle'}));
  }
  return view;
}
/* =========================================================================
   SECTOR 3 · MARKETING (pauta)
   ========================================================================= */
function tipoAds(t){
  const s=norm(t);
  if(s.includes('product')) return 'Product Ads';
  if(s.includes('brand')) return 'Brand Ads';
  if(s.includes('dsp')||s.includes('display')) return 'DSP';
  return t||'Otros';
}
/* Unifica las tres fuentes sin duplicar: si un día/tipo ya viene en el reporte general, se ignora el detalle */
function adsUnificado(){
  const A=rowsOf('ads_diario').map(r=>({fecha:r.fecha,tipo:tipoAds(r.tipo),campana:r.campana,estado:r.estado,
    impresiones:r.impresiones,clics:r.clics,inversion:r.inversion,ingresos:r.ingresos,ventas:r.ventas,asistidas:r.asistidas,fuente:'General'}));
  const cover=new Set(A.filter(x=>x.inversion>0||x.ingresos>0).map(x=>x.fecha+'|'+x.tipo));
  const P=rowsOf('pads_diario').map(r=>({fecha:r.fecha,tipo:'Product Ads',campana:r.campana,estado:r.estado,
    impresiones:r.impresiones,clics:r.clics,inversion:r.inversion,ingresos:r.ingresos,ventas:r.ventas,asistidas:0,
    pagina:r.pagina,espacio:r.espacio,presupuesto:r.presupuesto,roas_obj:r.roas_obj,fuente:'PADS'}))
    .filter(r=>!cover.has(r.fecha+'|Product Ads'));
  const D=rowsOf('dsp_diario').map(r=>({fecha:r.fecha,tipo:'DSP',campana:r.campana,estado:'',
    impresiones:r.impresiones,clics:r.clics,inversion:r.inversion,ingresos:r.ingresos,ventas:r.ventas,asistidas:0,
    line_item:r.line_item,objetivo:r.objetivo,fuente:'DSP'}))
    .filter(r=>!cover.has(r.fecha+'|DSP'));
  return A.concat(P,D);
}

  if(tabs.cur==='dia'){
    const fechas=Array.from(new Set(cur.map(x=>x.fecha))).sort().reverse();
    const rows=fechas.map(f=>{ const dd=cur.filter(x=>x.fecha===f);
      const i=sum(dd,x=>x.inversion), g=sum(dd,x=>x.ingresos), v=sum(dd,x=>x.ventas), c=sum(dd,x=>x.clics), im2=sum(dd,x=>x.impresiones);
      return {fecha:f,dia:DIAS[isoToDate(f).getDay()],inversion:i,ingresos:g,roas:div(g,i),acos:div(i,g),ventas:v,clics:c,

  }
  return view;
}

function alertasPauta(cur,PC){
  const al=[];
  const camp=Array.from(sumBy(cur.filter(x=>x.campana),x=>x.campana,['inversion','ingresos','ventas','clics']).values());
  const inv=sum(cur,x=>x.inversion), ing=sum(cur,x=>x.ingresos);
  camp.sort((a,b)=>b.inversion-a.inversion).slice(0,12).forEach(x=>{
    const roas=div(x.ingresos,x.inversion);
    if(x.inversion>inv*0.05&&roas<2) al.push({lvl:'crit',t:`${x._k}: ROAS ${fX(roas)} con ${fMk(x.inversion)} invertidos`,d:'Está por debajo del punto de equilibrio típico. Bajar presupuesto, cambiar puja o pausar hasta revisar la publicación.'});
    else if(x.inversion>inv*0.1&&roas>=8) al.push({lvl:'good',t:`${x._k} rinde ${fX(roas)}`,d:`Con ${fMk(x.inversion)} generó ${fMk(x.ingresos)}. Es candidata a subir presupuesto.`});
  });
  (PC||[]).forEach(x=>{
    const perd=pctVal(x.imp_perd_pres);
    if(perd>0.1) al.push({lvl:'warn',t:`${x.campana} pierde ${fP(perd)} de impresiones por presupuesto`,d:`Con ROAS ${fX(x.roas||div(x.ingresos,x.inversion))} está dejando ventas afuera: subir el presupuesto diario (hoy ${fM(x.presupuesto)}).`});
    const perdR=pctVal(x.imp_perd_rank);
    if(perdR>0.6) al.push({lvl:'warn',t:`${x.campana} pierde ${fP(perdR)} de impresiones por ranking`,d:'No es plata: es posición. Suele mejorar con mejor precio, reputación, Full o una puja más alta.'});
  });
  if(inv&&div(inv,ing)>0.25) al.push({lvl:'warn',t:'ACOS general en '+fP(div(inv,ing)),d:'Más de un cuarto de lo que factura la pauta se va en pauta. Revisar las campañas de peor ROAS.'});
  return al.slice(0,10);
}

/* Retención real de Mercado Libre calculada con TUS datos: lo que ML se queda
   (comisión + envío + impuestos) según la diferencia entre ingresos y Margen ML. */
function retencionML(){
  const V=rowsOf('ventas_dia').filter(x=>x.margen>0&&x.ingresos>0);
  if(V.length<5) return {tasa:0.14, real:false, dias:V.length};
  const ing=sum(V,x=>x.ingresos), mar=sum(V,x=>x.margen);
  return {tasa:Math.max(0,Math.min(0.6,1-div(mar,ing))), real:true, dias:V.length};
}
/* Costo por publicación: un MLA puede tener varios SKU (variantes) → promedio */
function mapaCostos(){
  const m=new Map();
  rowsOf('costos').forEach(c=>{
    const k=mlaKey(c.mla); if(!k) return;
    const o=m.get(k)||{con:0,sin:0,n:0,skus:[]};
    o.con+=num(c.costoConIva); o.sin+=num(c.costoSinIva); o.n++; if(c.sku)o.skus.push(c.sku);
    m.set(k,o);
  });
  const out=new Map();
  m.forEach((o,k)=>out.set(k,{costoConIva:div(o.con,o.n),costoSinIva:div(o.sin,o.n),skus:o.skus,variantes:o.n}));
  return out;
}
function filasComerciales(){
  const C=rowsOf('comercial'), P=rowsOf('publicaciones'), PV=rowsOf('pub_ventas'), S=rowsOf('stock');
  const ret=retencionML(), E=economia(), costos=E.costoMla;
  const ventasMap=new Map(); PV.forEach(x=>ventasMap.set(mlaKey(x.mla),x));
  const planilla=new Map(); C.forEach(x=>planilla.set(mlaKey(x.mla)||x.sku,x));
  const stockMap=stockPorMLA();   /* Full (reporte de planificación) + depósito propio */

  const universo = P.length? P.map(x=>({mla:mlaKey(x.mla),titulo:x.titulo,categoria:x.categoria,precio:num(x.precio),
        estado:x.estado,promo:!!x.promo,visitas:num(x.visitas),histor:num(x.unidades)}))
    : PV.map(x=>({mla:mlaKey(x.mla),titulo:x.titulo,categoria:'Sin categoría',precio:div(x.facturacion,x.unidades),
        estado:'',promo:false,visitas:0,histor:num(x.unidades)}));

  return universo.map(x=>{
    const v=ventasMap.get(x.mla)||{}, pl=planilla.get(x.mla)||{}, st=stockMap.get(x.mla), co=costos.get(x.mla);
    const lista = num(pl.precio)||x.precio||div(v.facturacion,v.unidades);
    /* El precio REAL al que se vendió (facturación ÷ unidades) suele estar por debajo del de lista
       por promociones y cuotas; el margen se calcula sobre ese, no sobre el cartel. */
    const precioReal = v.unidades? div(v.facturacion,v.unidades) : lista;
    const precio = precioReal;
    const costo  = num(pl.costo)||(co?co.costo:0);                /* costo con IVA (Excel de costos o app de Pricing) */
    const stock  = num(pl.stock)||(st?st.full+st.flex:0);
    const vendidos = num(v.unidades)||num(pl.vendidos)||0;
    const facturacion = num(v.facturacion)||precio*vendidos;
    /* retención real de ESA publicación (el neto que paga ML) si la tenemos; si no, la tasa real del período */
    const retencion = pl.comision!=null&&pl.comision>0? pl.comision : retencionDe(x.mla,E);
    const neto = precio*(1-retencion) - num(pl.envio||0);
    const margenU = costo? neto-costo : null;
    const vDia=div(vendidos,30);
    return {mla:x.mla, mlaL:'MLA'+x.mla, sku:(co&&co.skus[0])||pl.sku||'', producto:x.titulo, lista,
      fuenteCosto: co?co.fuente:'', retReal: E.retMla.has(x.mla),
      brechaPrecio: lista? div(precioReal,lista)-1 : 0,
      categoria:x.categoria||'Sin categoría', estado:x.estado, promo:!!(pl.promo||x.promo), promoL:(pl.promo||x.promo)?'Sí':'No',
      desc:num(pl.desc), desde:pl.desde||'', hasta:pl.hasta||'',
      precio, costo, retencion, neto, margenU, margenPct: margenU==null?null:div(margenU,precio),
      stock, vendidos, visitas:x.visitas, facturacion,
      margenTotal: margenU==null?null:margenU*vendidos,
      capital: costo? stock*costo : null,
      vDia, dias: vDia&&stock? stock/vDia : null, rot: stock>0? div(vendidos,stock) : null,
      sinCosto: !costo, variantes: co?co.variantes:0};
  });
}

/* Stock por publicación: junta el Reporte de Planificación de Full (por SKU)
   con el export de Publicaciones (que trae el stock del depósito propio / Flex). */
function stockPorMLA(){
  /* El stock en Full aparece en los DOS reportes (plan de Full y export de publicaciones):
     es la misma mercadería, así que se toma el mayor de los dos, nunca la suma. */
  const m=new Map();
  const get=k=>{ let o=m.get(k); if(!o){ o={fullPlan:0,fullPub:0,caminoPlan:0,caminoPub:0,flex:0,sugeridas:0}; m.set(k,o);} return o; };
  rowsOf('full_plan').forEach(x=>{
    String(x.mlas||x.mla||'').split(',').map(mlaKey).filter(Boolean).forEach(k=>{
      const o=get(k); o.fullPlan+=num(x.aptas); o.caminoPlan+=num(x.camino); o.sugeridas+=num(x.sugeridas);
    });
  });
  rowsOf('stock').forEach(x=>{ const o=get(mlaKey(x.mla));
    o.flex+=num(x.stock_flex); o.fullPub+=num(x.stock_full); o.caminoPub+=num(x.en_camino); });
  const out=new Map();
  m.forEach((o,k)=>out.set(k,{full:Math.max(o.fullPlan,o.fullPub), camino:Math.max(o.caminoPlan,o.caminoPub),
    flex:o.flex, sugeridas:o.sugeridas}));
  return out;
}

function rubroDe(t){
  const s=norm(t);
  for(const [nom,ks] of RUBROS) if(ks.some(k=>s.includes(norm(k)))) return nom;
  return 'Otros';
}

}
/* =========================================================================
   SECTOR 8 · SUGERENCIAS (aprendizaje automático sobre tus propios datos)
   Todo se calcula en el navegador: regresión, estacionalidad, k-means,
   detección de anomalías y correlaciones. Sin servicios externos.
   ========================================================================= */
const media = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
const desvio = a => { if(a.length<2) return 0; const m=media(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };
function regresion(xs,ys){                       /* mínimos cuadrados */
  const n=xs.length; if(n<2) return {a:media(ys),b:0,r2:0};
  const mx=media(xs),my=media(ys);
  let num=0,den=0; for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  const b=den?num/den:0, a=my-b*mx;
  const ssTot=ys.reduce((s,y)=>s+(y-my)**2,0);
  const ssRes=ys.reduce((s,y,i)=>s+(y-(a+b*xs[i]))**2,0);
  return {a,b,r2:ssTot?1-ssRes/ssTot:0};
}
function pearson(xs,ys){
  const n=xs.length; if(n<3) return 0;
  const mx=media(xs),my=media(ys); let sxy=0,sx=0,sy=0;
  for(let i=0;i<n;i++){ sxy+=(xs[i]-mx)*(ys[i]-my); sx+=(xs[i]-mx)**2; sy+=(ys[i]-my)**2; }
  return (sx&&sy)? sxy/Math.sqrt(sx*sy) : 0;
}
/* k-means sencillo con inicialización determinista (mismos datos → mismos grupos) */
function kmeans(puntos,k,iter){
  if(puntos.length<k) return puntos.map((p,i)=>i);
  const dim=puntos[0].length;
  const orden=puntos.map((p,i)=>[p.reduce((a,b)=>a+b,0),i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  let cent=Array.from({length:k},(_,j)=>puntos[orden[Math.floor(j*(puntos.length-1)/(k-1||1))]].slice());
  let asign=new Array(puntos.length).fill(0);
  for(let it=0;it<(iter||25);it++){
    let cambio=false;
    puntos.forEach((p,i)=>{
      let mejor=0,mejorD=Infinity;
      cent.forEach((c,j)=>{ let d=0; for(let q=0;q<dim;q++) d+=(p[q]-c[q])**2; if(d<mejorD){mejorD=d;mejor=j;} });
      if(asign[i]!==mejor){ asign[i]=mejor; cambio=true; }
    });
    cent=cent.map((c,j)=>{ const g=puntos.filter((p,i)=>asign[i]===j);
      return g.length? Array.from({length:dim},(_,q)=>media(g.map(p=>p[q]))) : c; });
    if(!cambio) break;
  }
  return asign;
}
/* Pronóstico: tendencia lineal + factor por día de la semana (estacionalidad semanal) */
function pronostico(serie,dias){
  const ys=serie.map(x=>x.v), xs=serie.map((_,i)=>i);
  const reg=regresion(xs,ys);
  const factor={};
  for(let d=0;d<7;d++){
    const g=serie.filter(s=>isoToDate(s.f).getDay()===d);
    const esperado=g.map(s=>reg.a+reg.b*serie.indexOf(s));
    factor[d]= g.length&&media(esperado)? media(g.map(s=>s.v))/media(esperado) : 1;
  }
  const resid=serie.map((s,i)=>s.v-(reg.a+reg.b*i)*factor[isoToDate(s.f).getDay()]);
  const err=desvio(resid);
  const out=[]; const ult=isoToDate(serie[serie.length-1].f);
  for(let i=1;i<=dias;i++){
    const f=new Date(ult); f.setDate(f.getDate()+i);
    const base=(reg.a+reg.b*(serie.length-1+i))*factor[f.getDay()];
    out.push({f:iso(f),v:Math.max(0,base),lo:Math.max(0,base-1.28*err),hi:base+1.28*err});
  }
  return {puntos:out,reg,err,factor};
}

      return {j,nombre,accion,lvl,n:g.length,vis,cv,pr,un,fact:sum(g,x=>x.facturacion),items:g};
    }).filter(Boolean).sort((a,b)=>b.fact-a.fact);

      rows:porCat,sort:{k:'r',dir:'asc'},csvName:'precio_conversion'}));

    /* publicaciones caras dentro de su categoría y con baja conversión */
    const sugPrecio=[];
    Array.from(groupBy(activas.filter(x=>x.precio>0),x=>x.categoria)).forEach(([k,v])=>{
      if(v.length<5) return;
      const pMed=median(v.map(x=>x.precio)), cMed=median(v.map(x=>x.conv));
      v.forEach(x=>{ if(x.precio>pMed*1.25&&x.conv<cMed*0.7&&x.visitas>=300)
        sugPrecio.push({...x,pMed,cMed,gap:div(x.precio,pMed)-1,
          potencial:(cMed-x.conv)*x.visitas*x.precio}); });
    });
    sugPrecio.sort((a,b)=>b.potencial-a.potencial);
    if(sugPrecio.length) view.appendChild(dataTable({id:'sug_precio2',title:'Candidatas a revisar precio',
      sub:'Están más de 25% por encima de la mediana de su categoría y convierten bastante menos, con tráfico suficiente para que el dato sea confiable',
      cols:[{k:'mlaL',l:'MLA'},{k:'titulo',l:'Publicación'},{k:'categoria',l:'Categoría'},{k:'precio',l:'Precio',t:'money'},
        {k:'pMed',l:'Mediana categoría',t:'money'},{k:'gap',l:'Sobreprecio',t:'pct'},
        {k:'conv',l:'Su conversión',t:'pct'},{k:'cMed',l:'Conversión típica',t:'pct'},{k:'visitas',l:'Visitas',t:'num'},
        {k:'potencial',l:'Facturación en juego',t:'money',total:'sum'}],
      rows:sugPrecio,sort:{k:'potencial',dir:'desc'},totals:true,searchKeys:['titulo','categoria'],csvName:'revisar_precio'}));
  }

  /* ---------- 5. PLAN DE ACCIÓN PRIORIZADO ---------- */
  if(tabs.cur==='plan'){
    const acciones=[];
    /* a) potencial no aprovechado por conversión debajo de su categoría */
    const catConv=new Map();
    Array.from(groupBy(activas.filter(x=>x.visitas>=100),x=>x.categoria)).forEach(([k,v])=>{ if(v.length>=4) catConv.set(k,median(v.map(x=>x.conv))); });
    activas.forEach(x=>{
      const ref=catConv.get(x.categoria); if(!ref||x.visitas<300) return;
      const brecha=ref-x.conv; if(brecha<=0.005) return;
      /* tope prudente: como mucho recuperar lo que ya factura hoy */
      const pot=Math.min(brecha*x.visitas*x.precio, Math.max(x.facturacion,brecha*x.visitas*x.precio*0.3));
      acciones.push({tipo:'Conversión',prioridad:pot,titulo:x.titulo,mla:x.mlaL,
        que:`Convierte ${fP(x.conv)} contra ${fP(ref)} típico de ${x.categoria}`,
        como:'Comparar precio y fotos con las que lideran la categoría, completar ficha técnica y medidas',
        impacto:pot});
    });
    /* b) publicaciones que convierten bien y tienen poco tráfico → pauta */
    const visMed=median(activas.map(x=>x.visitas));
    activas.forEach(x=>{
      if(x.conv>=0.06&&x.visitas<visMed&&x.precio>0){
        const pot=Math.min(x.conv*(visMed-x.visitas)*x.precio, Math.max(x.facturacion*2,50000));
        acciones.push({tipo:'Tráfico',prioridad:pot,titulo:x.titulo,mla:x.mlaL,
          que:`Convierte ${fP(x.conv)} con sólo ${fN(x.visitas)} visitas`,
          como:'Sumarla a Product Ads o mejorar título y atributos: ya sabemos que cuando la ven, compran',
          impacto:pot});
      }
    });
    /* c) quiebres y stock crítico según el reporte de planificación de Full */
    const F=rowsOf('full_plan');
    if(F.length){
      F.filter(x=>/sin stock|crítico|critico/i.test(x.nivel)&&num(x.ventas30)>0)
       .forEach(x=>{
         const sinStock=/sin stock/i.test(x.nivel);
         acciones.push({tipo:'Stock',prioridad:num(x.ventas30)*(sinStock?1:0.5),
           titulo:x.producto,mla:x.mla?'MLA'+x.mla:'',
           que:`${sinStock?'Sin stock en Full':'Stock crítico en Full ('+fN(x.aptas)+' unidades)'} y facturó ${fMk(x.ventas30)} en 30 días`,
           como:`Enviar ${fN(x.sugeridas)} unidades${x.limite?` antes del ${x.limite}`:''} — es la cantidad que sugiere Mercado Libre${x.clasificacion==='Estrella'?'; además es producto Estrella':''}`,
           impacto:num(x.ventas30)*(sinStock?0.5:0.2)});
       });
    } else {
      const S=rowsOf('stock');
      if(S.length){
        const stockMap=new Map(); S.forEach(x=>{ const k=mlaKey(x.mla); stockMap.set(k,(stockMap.get(k)||0)+num(x.stock_full)+num(x.stock_flex)); });
        pubs.forEach(x=>{ const st=stockMap.get(x.mla);
          if(st!=null&&st<=0&&x.unidades>0)
            acciones.push({tipo:'Stock',prioridad:x.facturacion,titulo:x.titulo,mla:x.mlaL,
              que:`Sin stock y venía vendiendo ${fN(x.unidades)} unidades`,
              como:'Reponer urgente: además de la venta perdida, ML castiga el posicionamiento',
              impacto:div(x.facturacion,30)*14});
        });
      }
    }
    /* d) fricción detectada en las preguntas */
    if(Q.length){
      const porPub=Array.from(groupBy(Q,x=>x.titulo||x.mla));
      porPub.forEach(([k,v])=>{
        if(v.length>=15&&div(v.filter(x=>x.compra).length,v.length)<0.05){
          const p=pubs.find(y=>y.titulo===k);
          acciones.push({tipo:'Preguntas',prioridad:(p?p.facturacion*0.15:v.length*1000),titulo:k,mla:p?p.mlaL:'',
            que:`${v.length} preguntas y casi ninguna termina en venta`,
            como:'La ficha no está respondiendo lo que la gente necesita: sumar tabla de medidas, fotos de detalle y aclarar compatibilidad',
            impacto:p?p.facturacion*0.15:0});
        }
      });
    }
    /* e) campañas con ROAS pobre */
    const ads=adsUnificado();
    if(ads.length){
      const camp=Array.from(sumBy(ads.filter(x=>x.campana),x=>x.campana,['inversion','ingresos']).values());
      camp.forEach(x=>{ const roas=div(x.ingresos,x.inversion);
        if(x.inversion>50000&&roas<2)
          acciones.push({tipo:'Pauta',prioridad:x.inversion,titulo:x._k,mla:'',
            que:`ROAS ${fX(roas)} con ${fMk(x.inversion)} invertidos`,
            como:'Bajar presupuesto o pausar hasta revisar la publicación de destino',
            impacto:x.inversion*0.5});
      });
    }
    acciones.sort((a,b)=>b.prioridad-a.prioridad);
    const impactoTotal=sum(acciones,x=>x.impacto);
    view.appendChild(kpiRow([
      {l:'Acciones sugeridas',ic:'🧠',v:fN(acciones.length),s:'ordenadas por impacto estimado',hl:true},
      {l:'Facturación en juego',ic:'💰',v:fMk(impactoTotal),s:'estimación prudente, acotada por lo que ya factura cada publicación'},
      {l:'De conversión',ic:'🛒',v:fN(acciones.filter(x=>x.tipo==='Conversión').length)},
      {l:'De tráfico',ic:'📣',v:fN(acciones.filter(x=>x.tipo==='Tráfico').length)},
      {l:'De stock',ic:'📦',v:fN(acciones.filter(x=>x.tipo==='Stock').length),inv:true},
      {l:'De atención',ic:'💬',v:fN(acciones.filter(x=>x.tipo==='Preguntas').length),inv:true}
    ]));
    if(!acciones.length){ view.appendChild(card('Sin sugerencias',null,alertBox([]))); return view; }
    view.appendChild(card('Las 5 primeras','Por dónde empezar esta semana',
      alertBox(acciones.slice(0,5).map(x=>({lvl:x.tipo==='Stock'?'crit':'warn',
        t:`${x.titulo.slice(0,70)} — ${x.que}`,
        d:`${x.como}. Impacto estimado: <b>${fMk(x.impacto)}</b>`})))));
    view.appendChild(dataTable({id:'sug_plan',title:'Todas las sugerencias',
      filters:[{k:'tipo',label:'Tipo',options:['Conversión','Tráfico','Stock','Preguntas','Pauta']}],
      cols:[{k:'tipo',l:'Tipo',t:'pill',render:r=>`<span class="pill ${r.tipo==='Stock'?'p-crit':r.tipo==='Pauta'?'p-warn':'p-info'}">${esc(r.tipo)}</span>`},
        {k:'titulo',l:'Publicación / campaña'},{k:'mla',l:'MLA'},{k:'que',l:'Qué detecté'},{k:'como',l:'Qué hacer'},
        {k:'impacto',l:'Impacto estimado',t:'money',total:'sum'}],
      rows:acciones,sort:{k:'impacto',dir:'desc'},totals:true,searchKeys:['titulo','que','como','tipo'],csvName:'sugerencias'}));
  }
  return view;
}
/* =========================================================================
   APP · navegación, sincronización y arranque

const VIEWS={resumen:viewResumen,atencion:viewAtencion,marketing:viewMarketing,catalogo:viewCatalogo,
             comercial:viewComercial,logistica:viewLogistica,negocio:viewNegocio,sugerencias:viewSugerencias};

function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  SECTORES.forEach(s=>{
    const filas=s.datasets.reduce((a,k)=>a+rowsOf(k).length,0);
    const b=el('button',(UI.sector===s.id?'active':'')+(s.derivado||filas?'':' empty'),
      `<span class="ic">${s.ic}</span>${esc(s.nom)}`+(s.derivado?'':`<span class="badge">${filas?fNk(filas):'0'}</span>`));
    b.onclick=()=>{ UI.sector=s.id; location.hash=s.id; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    nav.appendChild(b);
  });
}
/* Arregla en el momento los datos ya guardados con la conversión en escala porcentual
   (ej. 0,8 guardado como 0,8 en vez de 0,008). Se hace una sola vez por carga. */
function repararConversion(){
  const d=DB.datasets.publicaciones; if(!d||d._convOK) return;
  (d.rows||[]).forEach(r=>{ const c=num(r.conversion); if(c>0.5) r.conversion=c/100; });
  d._convOK=true;
}
function render(){
  repararConversion();
  killCharts();
  renderNav();
  const v=$('#view'); v.innerHTML='';
  try{ v.appendChild((VIEWS[UI.sector]||viewResumen)()); }
  catch(e){ console.error(e); v.appendChild(card('Ocurrió un error al armar esta vista',null,
    `<p>${esc(e.message)}</p><p style="color:var(--muted);font-size:12.5px">Probá volver a cargar el Excel de este sector. Si el problema sigue, revisá que el archivo tenga el formato original del reporte.</p>`)); }
}

/* ------------------------------ diálogos ------------------------------ */
const SQL_TABLA=`create table if not exists gh_reportes (
  clave       text primary key,
  sector      text,
  etiqueta    text,
  filas       jsonb,
  meta        jsonb,
  origen      text,
  autor       text,
  rev         bigint      default 0,
  actualizado timestamptz default now()
);
alter table gh_reportes add column if not exists rev bigint default 0;
alter table gh_reportes enable row level security;
create policy "gh_reportes acceso" on gh_reportes
  for all using (true) with check (true);`;

function dlgSync(){
  const seg=SB.lastOk?Math.round((Date.now()-SB.lastOk)/1000):null;
  dialog('Sincronización con el equipo',
    `<p style="margin-top:0">Cuando está conectada, cada Excel que carga alguien queda disponible para todos: la app revisa el servidor cada 20 segundos y baja sólo lo que cambió.</p>
     <div style="display:grid;gap:9px;margin:12px 0">
       <label style="font-size:12.5px;font-weight:600">Tu nombre <span style="font-weight:400;color:var(--muted)">— para que el resto vea quién cargó cada reporte</span>
         <input id="sbN" type="text" value="${esc(DB.meta.user||'')}" placeholder="Ej: Lucas" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;margin-top:4px"></label>
       <label style="font-size:12.5px;font-weight:600">URL del proyecto Supabase
         <input id="sbU" type="text" value="${esc(DB.cfg.url||'')}" placeholder="https://xxxx.supabase.co" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;margin-top:4px"></label>
       <label style="font-size:12.5px;font-weight:600">Clave pública (anon)
         <input id="sbK" type="password" value="${esc(DB.cfg.key||'')}" placeholder="eyJ..." style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;margin-top:4px"></label>
     </div>
     <p style="font-size:12.5px;color:var(--ink2);margin-bottom:6px"><b>Una sola vez:</b> creá la tabla en el editor SQL de Supabase.</p>
     <code class="sql">${esc(SQL_TABLA)}</code>
     <p style="font-size:12px;color:var(--muted);margin-bottom:0">Estado: ${SB.on?(SB.err?'<b style="color:var(--crit)">con error</b>':'conectada'):'sin configurar'}${seg!=null?' · última verificación hace '+seg+' s':''}${SB.err?'<br>Último error: '+esc(SB.err.slice(0,180)):''}</p>`,
    [{t:'Cerrar'},
     {t:'Trabajar solo local',fn:()=>{ DB.cfg={url:'',key:''}; saveCfg(); clearInterval(SYNC.timer); estadoSync(); toast('Modo local'); }},
     {t:'Guardar y conectar',cls:'primary',fn:(b)=>{
        DB.meta.user=$('#sbN',b).value.trim(); 
        DB.cfg={url:$('#sbU',b).value.trim().replace(/\/$/,''),key:$('#sbK',b).value.trim()}; saveCfg(); saveLocal();
        arrancarSync();
        sync(false).then(()=>{ render(); if(SB.faltaTabla) toast('Falta crear la tabla gh_reportes en Supabase',true); });
     }}]);
}
function dlgDatos(){
  let h='<p style="margin-top:0;color:var(--ink2)">Qué hay cargado hoy en cada sector.</p>';
  SECTORES.forEach(s=>{
    h+=`<div style="margin:12px 0 4px;font-weight:700;font-size:13px">${s.ic} ${esc(s.nom)}</div>`;
    s.datasets.forEach(k=>{ const i=dsInfo(k); const d=DATASETS[k];
      h+=`<div class="ds-row"><span class="nm"><b>${esc(d.label)}</b><br><span class="st">${esc(d.desc)}</span></span>
        <span class="st">${i?`${fN(i.rows.length)} filas<br>${fDT(i.ts)}${i.src?'<br>'+esc(i.src.slice(0,28)):''}`:'—'}</span>
        ${i?`<button class="btn sm" data-del="${k}">Borrar</button>`:''}</div>`;
    });
  });
  const d=dialog('Estado de los datos',h,[{t:'Cerrar'},{t:'Exportar respaldo (JSON)',fn:()=>{
      const blob=new Blob([JSON.stringify({datasets:DB.datasets,history:DB.history},null,1)],{type:'application/json'});
      const a=el('a'); a.href=URL.createObjectURL(blob); a.download='ganga_control_respaldo.json'; a.click();
    }}]);
  $$('[data-del]',d).forEach(b=>b.onclick=()=>{
    const k=b.dataset.del;
    if(!confirm('¿Borrar "'+DATASETS[k].label+'"? Se borra para todo el equipo la próxima vez que sincronicen.')) return;
    delete DB.datasets[k]; saveLocal();
    if(SB.on) SB.remove(k).catch(e=>toast('No se pudo borrar en el servidor: '+e.message,true));
    b.closest('.ds-row').remove(); render(); toast('Conjunto borrado');
  });
}
function dlgHist(){
  const h=DB.history.length? DB.history.map(x=>`<div class="ds-row"><span class="nm"><b>${esc(x.label)}</b><br><span class="st">${esc(x.src||'')}</span></span>
      <span class="st">${fN(x.rows)} filas<br>${fDT(x.ts)}</span></div>`).join('')
    : '<div class="empty">Todavía no hay cargas registradas.</div>';
  dialog('Historial de cargas',h,[{t:'Cerrar'}]);
}

function dlgGuia(){
  const filas=[
    ['📈 Resumen Ejecutivo','<b>Resultados ML.xlsx</b> (hojas “Ventas” y “Base ventas”) o el Excel de <b>Análisis de Publicaciones</b>','Ventas por día, por provincia y ranking de productos, con comparación contra el período anterior'],
    ['💬 Atención al Cliente','<b>Resultados ML.xlsx</b>: “Base de preguntas” y “Base de Cancelaciones + Reclamos”','Volumen de preguntas, horarios, tiempo de respuesta, motivos y casos de postventa'],
    ['📣 Marketing','<b>Seguimiento de Pauta.xlsx</b> (hoja “Datos”), <b>Perfo Campañas.xlsx</b> (“Datos DSP Diario” y “PADS”) y la hoja “Datos” de Resultados ML','Inversión, ROAS, ACOS y alertas por campaña; las tres fuentes se unifican sin duplicar'],
    ['🏷️ Catálogo','<b>Análisis de Publicaciones.xlsx</b>: “Publicaciones GH” y “Publicaciones con Ventas GH”','Visitas, conversión, precio y oportunidades concretas por publicación'],
    ['💰 Comercial','El Excel de <b>costos por producto</b> (SKU, MLA, IVA%, Costo s/IVA, Costo c/IVA). Opcional: la plantilla comercial para stock y promociones','Margen real por publicación (precio real de venta − retención de ML − costo c/IVA), rotación, promociones y clasificación ABC'],
    ['📦 Logística','El <b>Reporte de Planificación</b> de Full (stock, en camino y sugerencia de ML). Sumá el export de <b>Publicaciones</b> si querés ver también el depósito propio de Flex','Stock en Full, nivel por producto, días de cobertura, facturación en riesgo y la lista de qué enviar a Full con volumen y fecha límite'],
    ['🔍 Análisis de Negocio','<b>Análisis de Publicaciones.xlsx</b>: hojas del competidor (DB)','Comparación de ingresos, unidades, ticket y rubros contra la competencia'],
    ['🧠 Sugerencias','No necesita archivo propio: usa todo lo que ya cargaron los demás sectores','Pronóstico de ventas, segmentación del catálogo, días fuera de lo normal y un plan de acción ordenado por impacto en pesos']
  ];
  dialog('Cómo se usa',
    `<p style="margin-top:0">Cada sector se actualiza cargando su Excel con el botón amarillo <b>Cargar Excel</b>. Podés arrastrar varios archivos juntos: la app mira todas las hojas, te dice qué reconoció y vos confirmás.</p>
     <p style="font-size:12.5px;color:var(--ink2)"><b>Importante:</b> mantené siempre el mismo formato de los reportes. Los datos nuevos se suman a los viejos (mismo día o misma publicación se pisan con lo último), así que podés cargar mes a mes.</p>
     <p style="font-size:12.5px;color:var(--ink2)">En todas las tablas: clic en el encabezado para ordenar de mayor a menor, otro clic para invertir. Buscador y filtros arriba, y botón CSV para bajar lo que estás viendo.</p>
     <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px">
      ${filas.map(f=>`<tr><td style="padding:7px 8px 7px 0;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:top"><b>${f[0]}</b></td>
        <td style="padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top">${f[1]}<br><span style="color:var(--muted)">${f[2]}</span></td></tr>`).join('')}
     </table>`,
    [{t:'Entendido',cls:'primary'}]);
}

/* ------------------------------ arranque ------------------------------ */
function wire(){
  $('#syncBtn').onclick=dlgSync;
  $('#btnData').onclick=dlgDatos;
  $('#btnHist').onclick=dlgHist;
  $('#btnGuia').onclick=dlgGuia;
  $('#btnRefresh').onclick=()=>sync(false);
  $('#filePick').onchange=e=>{ importFiles(e.target.files); e.target.value=''; };
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); document.body.classList.add('dragging'); }));
  ['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); if(ev==='drop'&&e.dataTransfer.files.length) importFiles(e.dataTransfer.files); }));
  window.addEventListener('hashchange',()=>{ const h=location.hash.replace('#',''); if(VIEWS[h]&&h!==UI.sector){ UI.sector=h; render(); } });
}
async function init(){
  loadLocal();
  const h=location.hash.replace('#',''); if(VIEWS[h]) UI.sector=h;
  wire(); render(); estadoSync();
  PRICING.cargar().then(()=>{ _ECO=null; render(); });
  if(!SB.on) await autoDetectSupabase();
  if(SB.on){
    setSync('on','Sincronizando…');
    await sync(true);
    arrancarSync();
    if(SB.faltaTabla) setTimeout(()=>dialog('Falta un paso para trabajar en equipo',
      `<p style="margin-top:0">Encontré la conexión a Supabase, pero todavía no existe la tabla <b>gh_reportes</b>, así que por ahora cada computadora ve sólo sus propios datos.</p>
       <p style="font-size:12.5px;color:var(--ink2)">Copiá esto en el editor SQL de Supabase y dale Run. Es una sola vez para todo el equipo.</p>
       <code class="sql">${esc(SQL_TABLA)}</code>`,[{t:'Después',},{t:'Ya lo hago',cls:'primary',fn:()=>sync(false)}]),900);
    else if(!DB.meta.user) setTimeout(()=>toast('Poné tu nombre en el botón de sincronización para que el equipo sepa quién carga cada reporte'),1200);
  } else estadoSync();
  if(!Object.keys(DB.datasets).length) setTimeout(()=>toast('Empezá cargando un Excel con el botón amarillo ⬆️'),700);
}
init();
