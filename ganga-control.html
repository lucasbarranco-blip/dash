/* =========================================================================
   SECTOR 8 · SUGERENCIAS (aprendizaje automático sobre tus propios datos)
   Todo se calcula en el navegador: regresión, estacionalidad, k-means,
   detección de anomalías y correlaciones. Sin servicios externos.
   ========================================================================= */
const media = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
const desvio = a => { if(a.length<2) return 0; const m=media(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };
function regresion(xs,ys){                       /* mínimos cuadrados */
  const n=xs.length; if(n<2) return {a:media(ys),b:0,r2:0};
  const mx=media(xs),my=media(ys);
  let num=0,den=0; for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  const b=den?num/den:0, a=my-b*mx;
  const ssTot=ys.reduce((s,y)=>s+(y-my)**2,0);
  const ssRes=ys.reduce((s,y,i)=>s+(y-(a+b*xs[i]))**2,0);
  return {a,b,r2:ssTot?1-ssRes/ssTot:0};
}
function pearson(xs,ys){
  const n=xs.length; if(n<3) return 0;
  const mx=media(xs),my=media(ys); let sxy=0,sx=0,sy=0;
  for(let i=0;i<n;i++){ sxy+=(xs[i]-mx)*(ys[i]-my); sx+=(xs[i]-mx)**2; sy+=(ys[i]-my)**2; }
  return (sx&&sy)? sxy/Math.sqrt(sx*sy) : 0;
}
/* k-means sencillo con inicialización determinista (mismos datos → mismos grupos) */
function kmeans(puntos,k,iter){
  if(puntos.length<k) return puntos.map((p,i)=>i);
  const dim=puntos[0].length;
  const orden=puntos.map((p,i)=>[p.reduce((a,b)=>a+b,0),i]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  let cent=Array.from({length:k},(_,j)=>puntos[orden[Math.floor(j*(puntos.length-1)/(k-1||1))]].slice());
  let asign=new Array(puntos.length).fill(0);
  for(let it=0;it<(iter||25);it++){
    let cambio=false;
    puntos.forEach((p,i)=>{
      let mejor=0,mejorD=Infinity;
      cent.forEach((c,j)=>{ let d=0; for(let q=0;q<dim;q++) d+=(p[q]-c[q])**2; if(d<mejorD){mejorD=d;mejor=j;} });
      if(asign[i]!==mejor){ asign[i]=mejor; cambio=true; }
    });
    cent=cent.map((c,j)=>{ const g=puntos.filter((p,i)=>asign[i]===j);
      return g.length? Array.from({length:dim},(_,q)=>media(g.map(p=>p[q]))) : c; });
    if(!cambio) break;
  }
  return asign;
}
/* Pronóstico: tendencia lineal + factor por día de la semana (estacionalidad semanal) */
function pronostico(serie,dias){
  const ys=serie.map(x=>x.v), xs=serie.map((_,i)=>i);
  const reg=regresion(xs,ys);
  const factor={};
  for(let d=0;d<7;d++){
    const g=serie.filter(s=>isoToDate(s.f).getDay()===d);
    const esperado=g.map(s=>reg.a+reg.b*serie.indexOf(s));
    factor[d]= g.length&&media(esperado)? media(g.map(s=>s.v))/media(esperado) : 1;
  }
  const resid=serie.map((s,i)=>s.v-(reg.a+reg.b*i)*factor[isoToDate(s.f).getDay()]);
  const err=desvio(resid);
  const out=[]; const ult=isoToDate(serie[serie.length-1].f);
  for(let i=1;i<=dias;i++){
    const f=new Date(ult); f.setDate(f.getDate()+i);
    const base=(reg.a+reg.b*(serie.length-1+i))*factor[f.getDay()];
    out.push({f:iso(f),v:Math.max(0,base),lo:Math.max(0,base-1.28*err),hi:base+1.28*err});
  }
  return {puntos:out,reg,err,factor};
}

function viewSugerencias(){
  const V=rowsOf('ventas_dia'), P=rowsOf('publicaciones'), PV=rowsOf('pub_ventas'), C=rowsOf('postventa'), Q=rowsOf('preguntas');
  const view=el('div');
  view.appendChild(uploadStrip('sugerencias'));
  if(V.length<14&&!P.length){ view.appendChild(emptyState('sugerencias','Necesito al menos dos semanas de ventas o el catálogo de publicaciones para poder entrenar los modelos. Cargá los Excel de Resumen y Catálogo.')); return view; }

  const tabs=subTabs('sugerencias',[{id:'plan',nom:'Plan de acción'},{id:'fore',nom:'Pronóstico'},{id:'seg',nom:'Segmentos'},{id:'anom',nom:'Anomalías'},{id:'precio',nom:'Precio y conversión'}]);
  view.appendChild(tabs.node);
  view.appendChild(el('div','note info','Estas sugerencias las calcula la app sola con tus datos históricos: tendencia y estacionalidad para el pronóstico, agrupamiento (k-means) para los segmentos y desvíos estadísticos para las anomalías. Son una guía para priorizar, no una verdad absoluta — siempre mostramos de dónde sale cada número.'));

  /* ---------- base de publicaciones enriquecida ---------- */
  const ventasMap=new Map(); PV.forEach(x=>ventasMap.set(mlaKey(x.mla),x));
  const pubs=P.map(x=>{ const v=ventasMap.get(mlaKey(x.mla))||{};
    return {mla:mlaKey(x.mla),mlaL:'MLA'+mlaKey(x.mla),titulo:x.titulo,categoria:x.categoria||'Sin categoría',
      precio:num(v.unidades)? div(v.facturacion,v.unidades) : num(x.precio),   /* precio real de venta */
      lista:num(x.precio),visitas:num(x.visitas),conv:num(x.conversion),estado:x.estado,promo:!!x.promo,
      unidades:num(v.unidades)||num(x.unidades),facturacion:num(v.facturacion)||num(x.precio)*num(x.unidades)}; });
  const activas=pubs.filter(x=>norm(x.estado).startsWith('activ'));

  /* ---------- 1. PRONÓSTICO ---------- */
  const serie=V.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).map(x=>({f:x.fecha,v:x.ingresos,u:x.unidades}));
  let fc=null, fcU=null;
  if(serie.length>=14){
    fc=pronostico(serie,14);
    fcU=pronostico(serie.map(x=>({f:x.f,v:x.u})),14);
  }

  if(tabs.cur==='fore'){
    if(!fc){ view.appendChild(card(null,null,'<div class="empty">Necesito al menos 14 días de ventas para pronosticar.</div>')); return view; }
    const totalProx=sum(fc.puntos,x=>x.v), ultimos14=sum(serie.slice(-14),x=>x.v);
    const tendencia=fc.reg.b;
    view.appendChild(kpiRow([
      {l:'Ingresos previstos · 14 días',ic:'🔮',v:fMk(totalProx),s:`${fMk(div(totalProx,14))} por día`,hl:true},
      {l:'Contra los últimos 14 días',ic:'📊',v:fP(div(totalProx-ultimos14,ultimos14)),s:fMk(ultimos14)+' reales',d:div(totalProx-ultimos14,ultimos14)},
      {l:'Tendencia diaria',ic:tendencia>=0?'📈':'📉',v:(tendencia>=0?'+':'')+fMk(tendencia),s:'lo que cambia por día según la recta'},
      {l:'Unidades previstas',ic:'📦',v:fN(sum(fcU.puntos,x=>x.v)),s:'próximos 14 días'},
      {l:'Precisión del modelo',ic:'🎯',v:fP(Math.max(0,fc.reg.r2)),s:'R² de la tendencia · error típico '+fMk(fc.err)},
      {l:'Mejor día de la semana',ic:'📅',v:DIAS[+Object.entries(fc.factor).sort((a,b)=>b[1]-a[1])[0][0]],s:'según la estacionalidad aprendida'}
    ]));
    const c1=chartBox('Ventas reales y pronóstico','Últimos 60 días + próximos 14 · la banda es el rango probable (80%)',320);
    view.appendChild(c1.card);
    const hist=serie.slice(-60);
    const labels=[...hist.map(x=>fDate(x.f)),...fc.puntos.map(x=>fDate(x.f))];
    setTimeout(()=>lineChart(c1,labels,[
      {label:'Real',data:[...hist.map(x=>x.v),...fc.puntos.map(()=>null)],color:PAL[0]},
      {label:'Pronóstico',data:[...hist.map(()=>null).slice(0,-1),hist[hist.length-1].v,...fc.puntos.map(x=>x.v)],color:PAL[3]},
      {label:'Máximo probable',data:[...hist.map(()=>null),...fc.puntos.map(x=>x.hi)],color:PAL[4]},
      {label:'Mínimo probable',data:[...hist.map(()=>null),...fc.puntos.map(x=>x.lo)],color:PAL[2]}
    ]),0);
    const c2=chartBox('Estacionalidad semanal aprendida','Cuánto rinde cada día contra el promedio');
    view.appendChild(c2.card);
    const ordenDias=[1,2,3,4,5,6,0];
    setTimeout(()=>barChart(c2,ordenDias.map(d=>DIAS[d]),[{label:'Factor',data:ordenDias.map(d=>fc.factor[d]),
      colors:ordenDias.map(d=>fc.factor[d]>=1?PAL[2]:PAL[1])}],{money:false,fmt:v=>nf2.format(v)+'x',tick:v=>nf1.format(v)+'x'}),0);
    view.appendChild(dataTable({id:'sug_fc',title:'Pronóstico día por día',search:false,
      cols:[{k:'fecha',l:'Fecha',t:'date'},{k:'dia',l:'Día'},{k:'v',l:'Ingresos previstos',t:'money',total:'sum'},
        {k:'lo',l:'Mínimo probable',t:'money',total:'sum'},{k:'hi',l:'Máximo probable',t:'money',total:'sum'},{k:'u',l:'Unidades previstas',t:'num',total:'sum'}],
      rows:fc.puntos.map((x,i)=>({fecha:x.f,dia:DIAS[isoToDate(x.f).getDay()],v:x.v,lo:x.lo,hi:x.hi,u:fcU.puntos[i].v})),
      sort:{k:'fecha',dir:'asc'},totals:true,csvName:'pronostico'}));
  }

  /* ---------- 2. SEGMENTOS (k-means) ---------- */
  let segmentos=null;
  if(activas.length>=20){
    const base=activas.filter(x=>x.precio>0);
    const feats=base.map(x=>[Math.log10(1+x.visitas),x.conv*10,Math.log10(1+x.precio),Math.log10(1+x.unidades)]);
    const cols=[0,1,2,3].map(j=>({m:media(feats.map(f=>f[j])),s:desvio(feats.map(f=>f[j]))||1}));
    const norm4=feats.map(f=>f.map((v,j)=>(v-cols[j].m)/cols[j].s));
    const asign=kmeans(norm4,4,40);
    const grupos=[0,1,2,3].map(j=>{
      const g=base.filter((_,i)=>asign[i]===j);
      if(!g.length) return null;
      const vis=media(g.map(x=>x.visitas)), cv=media(g.map(x=>x.conv)), pr=media(g.map(x=>x.precio)), un=media(g.map(x=>x.unidades));
      const visRef=media(base.map(x=>x.visitas)), cvRef=media(base.map(x=>x.conv));
      let nombre,accion,lvl;
      if(vis>=visRef&&cv>=cvRef){ nombre='Motores del catálogo'; accion='Son las que sostienen la facturación: nunca deben quedarse sin stock y son las primeras candidatas a pauta.'; lvl='good'; }
      else if(vis>=visRef&&cv<cvRef){ nombre='Mucho tráfico, poca conversión'; accion='Entra gente y no compra. Revisar precio contra la competencia, fotos, tabla de medidas y costo de envío.'; lvl='crit'; }
      else if(vis<visRef&&cv>=cvRef){ nombre='Joyas escondidas'; accion='Convierten muy bien pero casi nadie las ve. Es el mejor lugar para invertir en Product Ads y mejorar título y atributos.'; lvl='warn'; }
      else { nombre='De baja rotación'; accion='Poco tráfico y poca conversión. Evaluar combos, promociones o directamente sacarlas del catálogo activo.'; lvl='neutral'; }
      return {j,nombre,accion,lvl,n:g.length,vis,cv,pr,un,fact:sum(g,x=>x.facturacion),items:g};
    }).filter(Boolean).sort((a,b)=>b.fact-a.fact);
    segmentos=grupos;
  }

  if(tabs.cur==='seg'){
    if(!segmentos){ view.appendChild(card(null,null,'<div class="empty">Necesito al menos 20 publicaciones activas con precio para armar los grupos.</div>')); return view; }
    const g=el('div','grid g2');
    segmentos.forEach(s=>{
      const c=card(null,null,`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="pill ${s.lvl==='good'?'p-good':s.lvl==='crit'?'p-crit':s.lvl==='warn'?'p-warn':'p-neutral'}">${esc(s.nombre)}</span>
          <b>${fN(s.n)} publicaciones</b></div>
        <div style="font-size:12.5px;color:var(--ink2);margin-bottom:8px">${esc(s.accion)}</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px">
          <span><b>${fNk(s.vis)}</b><br><span style="color:var(--muted)">visitas prom.</span></span>
          <span><b>${fP(s.cv)}</b><br><span style="color:var(--muted)">conversión</span></span>
          <span><b>${fM(s.pr)}</b><br><span style="color:var(--muted)">precio prom.</span></span>
          <span><b>${fN(s.un)}</b><br><span style="color:var(--muted)">unidades prom.</span></span>
          <span><b>${fMk(s.fact)}</b><br><span style="color:var(--muted)">facturación</span></span>
        </div>`);
      g.appendChild(c);
    });
    view.appendChild(g);
    const c3=chartBox('Mapa del catálogo','Cada punto es una publicación, agrupada por comportamiento',320);
    view.appendChild(c3.card);
    setTimeout(()=>scatterChart(c3,segmentos.slice(0,3).map((s,i)=>({
      label:s.nombre,color:PAL[i],data:s.items.filter(x=>x.visitas>0).map(x=>({x:x.visitas,y:x.conv,n:x.titulo.slice(0,40)}))
    })),{xl:'Visitas',yl:'Conversión',yfmt:fP}),0);
    view.appendChild(dataTable({id:'sug_seg',title:'Publicaciones por segmento',
      filters:[{k:'segmento',label:'Segmento',options:segmentos.map(s=>s.nombre)}],
      cols:[{k:'segmento',l:'Segmento',t:'pill',render:r=>`<span class="pill ${r.lvl==='good'?'p-good':r.lvl==='crit'?'p-crit':r.lvl==='warn'?'p-warn':'p-neutral'}">${esc(r.segmento)}</span>`},
        {k:'mlaL',l:'MLA'},{k:'titulo',l:'Publicación'},{k:'categoria',l:'Categoría'},{k:'precio',l:'Precio',t:'money'},
        {k:'visitas',l:'Visitas',t:'num',total:'sum'},{k:'conv',l:'Conversión',t:'pct'},{k:'unidades',l:'Unidades',t:'num',total:'sum'},
        {k:'facturacion',l:'Facturación',t:'money',total:'sum'}],
      rows:segmentos.flatMap(s=>s.items.map(x=>({...x,segmento:s.nombre,lvl:s.lvl}))),
      sort:{k:'facturacion',dir:'desc'},totals:true,searchKeys:['titulo','mla','categoria'],csvName:'segmentos'}));
  }

  /* ---------- 3. ANOMALÍAS ---------- */
  if(tabs.cur==='anom'){
    const anomalias=[];
    if(serie.length>=14){
      const xs=serie.map((_,i)=>i), ys=serie.map(x=>x.v);
      const reg=regresion(xs,ys);
      const resid=ys.map((y,i)=>y-(reg.a+reg.b*i));
      const sd=desvio(resid)||1;
      serie.forEach((s,i)=>{ const z=resid[i]/sd;
        if(Math.abs(z)>=2) anomalias.push({fecha:s.f,tipo:'Ventas',valor:s.v,esperado:reg.a+reg.b*i,z,
          detalle:`${z>0?'Vendiste bastante más':'Vendiste bastante menos'} de lo esperado para ese día`}); });
    }
    const ads=adsUnificado();
    if(ads.length){
      const porDia=Array.from(sumBy(ads,x=>x.fecha,['inversion','ingresos']).values()).sort((a,b)=>a._k<b._k?-1:1);
      const roas=porDia.filter(x=>x.inversion>0).map(x=>({f:x._k,v:div(x.ingresos,x.inversion),inv:x.inversion}));
      const m=media(roas.map(x=>x.v)), sd=desvio(roas.map(x=>x.v))||1;
      roas.forEach(x=>{ const z=(x.v-m)/sd;
        if(Math.abs(z)>=2) anomalias.push({fecha:x.f,tipo:'ROAS de pauta',valor:x.v,esperado:m,z,
          detalle:`ROAS de ${fX(x.v)} contra un promedio de ${fX(m)} · invertiste ${fMk(x.inv)} ese día`}); });
    }
    if(C.length){
      const porDia=Array.from(groupBy(C.filter(x=>x.fecha),x=>x.fecha)).map(([f,v])=>({f,v:v.length}));
      const m=media(porDia.map(x=>x.v)), sd=desvio(porDia.map(x=>x.v))||1;
      porDia.forEach(x=>{ const z=(x.v-m)/sd;
        if(z>=2.5) anomalias.push({fecha:x.f,tipo:'Postventa',valor:x.v,esperado:m,z,
          detalle:`${x.v} casos en un día contra un promedio de ${nf1.format(m)}`}); });
    }
    anomalias.sort((a,b)=>Math.abs(b.z)-Math.abs(a.z));
    view.appendChild(kpiRow([
      {l:'Días atípicos detectados',ic:'🔍',v:fN(anomalias.length),s:'se apartan más de 2 desvíos de lo normal',hl:true},
      {l:'Picos positivos',ic:'📈',v:fN(anomalias.filter(x=>x.z>0&&x.tipo==='Ventas').length),s:'ventas muy por encima'},
      {l:'Caídas',ic:'📉',v:fN(anomalias.filter(x=>x.z<0&&x.tipo==='Ventas').length),s:'ventas muy por debajo',inv:true},
      {l:'Alertas de pauta',ic:'📣',v:fN(anomalias.filter(x=>x.tipo==='ROAS de pauta').length),inv:true}
    ]));
    if(!anomalias.length) view.appendChild(card('Sin anomalías',null,alertBox([])));
    else view.appendChild(dataTable({id:'sug_anom',title:'Días fuera de lo normal',
      sub:'Ordenados por cuánto se apartan de lo esperado. Sirve para entender qué pasó ese día y repetirlo o evitarlo.',
      cols:[{k:'fecha',l:'Fecha',t:'date'},{k:'dia',l:'Día'},{k:'tipo',l:'Indicador'},
        {k:'valorL',l:'Valor real'},{k:'espL',l:'Esperado'},
        {k:'z',l:'Desvíos',t:'num2',render:r=>`<span class="pill ${Math.abs(r.z)>=3?'p-crit':'p-warn'}">${r.z>0?'+':''}${nf1.format(r.z)}σ</span>`},
        {k:'detalle',l:'Qué pasó'}],
      rows:anomalias.map(x=>({...x,dia:DIAS[isoToDate(x.fecha).getDay()],
        valorL:x.tipo==='Ventas'?fMk(x.valor):x.tipo==='ROAS de pauta'?fX(x.valor):fN(x.valor),
        espL:x.tipo==='Ventas'?fMk(x.esperado):x.tipo==='ROAS de pauta'?fX(x.esperado):nf1.format(x.esperado)})),
      sort:{k:'fecha',dir:'desc'},searchKeys:['tipo','detalle'],csvName:'anomalias'}));
  }

  /* ---------- 4. PRECIO Y CONVERSIÓN ---------- */
  if(tabs.cur==='precio'){
    if(activas.length<20){ view.appendChild(card(null,null,'<div class="empty">Necesito más publicaciones activas para analizar precios.</div>')); return view; }
    const porCat=Array.from(groupBy(activas.filter(x=>x.precio>0&&x.visitas>=100),x=>x.categoria))
      .filter(([k,v])=>v.length>=5)
      .map(([k,v])=>{
        const r=pearson(v.map(x=>Math.log10(x.precio)),v.map(x=>x.conv));
        const convMed=median(v.map(x=>x.conv));
        return {categoria:k,n:v.length,r,precioMed:median(v.map(x=>x.precio)),convMed,
          lectura: r<=-0.35? 'El precio pesa: los más baratos convierten mejor'
                 : r>=0.35? 'Acá el precio alto no frena: se compra por calidad percibida'
                 : 'El precio no explica la conversión: el problema o la ventaja está en otro lado'};
      }).sort((a,b)=>a.r-b.r);
    view.appendChild(card('Cuánto influye el precio en cada categoría',
      'Correlación entre precio y conversión de tus publicaciones activas con tráfico. Cerca de −1: bajar precio ayuda. Cerca de 0: el precio no es el problema.',
      null));
    const c=chartBox(null,null,Math.max(220,porCat.length*24));
    view.appendChild(c.card);
    setTimeout(()=>barChart(c,porCat.map(x=>x.categoria.slice(0,34)),[{label:'Correlación precio-conversión',data:porCat.map(x=>x.r),
      colors:porCat.map(x=>x.r<=-0.35?ST.crit:x.r>=0.35?ST.good:'#898781')}],{horizontal:true,money:false,fmt:v=>nf2.format(v),tick:v=>nf1.format(v),thick:16}),0);
    view.appendChild(dataTable({id:'sug_precio',title:'Lectura por categoría',search:false,
      cols:[{k:'categoria',l:'Categoría'},{k:'n',l:'Publicaciones',t:'num'},{k:'precioMed',l:'Precio mediano',t:'money'},
        {k:'convMed',l:'Conversión mediana',t:'pct'},{k:'r',l:'Correlación',t:'num2'},{k:'lectura',l:'Qué significa'}],
      rows:porCat,sort:{k:'r',dir:'asc'},csvName:'precio_conversion'}));

    /* publicaciones caras dentro de su categoría y con baja conversión */
    const sugPrecio=[];
    Array.from(groupBy(activas.filter(x=>x.precio>0),x=>x.categoria)).forEach(([k,v])=>{
      if(v.length<5) return;
      const pMed=median(v.map(x=>x.precio)), cMed=median(v.map(x=>x.conv));
      v.forEach(x=>{ if(x.precio>pMed*1.25&&x.conv<cMed*0.7&&x.visitas>=300)
        sugPrecio.push({...x,pMed,cMed,gap:div(x.precio,pMed)-1,
          potencial:(cMed-x.conv)*x.visitas*x.precio}); });
    });
    sugPrecio.sort((a,b)=>b.potencial-a.potencial);
    if(sugPrecio.length) view.appendChild(dataTable({id:'sug_precio2',title:'Candidatas a revisar precio',
      sub:'Están más de 25% por encima de la mediana de su categoría y convierten bastante menos, con tráfico suficiente para que el dato sea confiable',
      cols:[{k:'mlaL',l:'MLA'},{k:'titulo',l:'Publicación'},{k:'categoria',l:'Categoría'},{k:'precio',l:'Precio',t:'money'},
        {k:'pMed',l:'Mediana categoría',t:'money'},{k:'gap',l:'Sobreprecio',t:'pct'},
        {k:'conv',l:'Su conversión',t:'pct'},{k:'cMed',l:'Conversión típica',t:'pct'},{k:'visitas',l:'Visitas',t:'num'},
        {k:'potencial',l:'Facturación en juego',t:'money',total:'sum'}],
      rows:sugPrecio,sort:{k:'potencial',dir:'desc'},totals:true,searchKeys:['titulo','categoria'],csvName:'revisar_precio'}));
  }

  /* ---------- 5. PLAN DE ACCIÓN PRIORIZADO ---------- */
  if(tabs.cur==='plan'){
    const acciones=[];
    /* a) potencial no aprovechado por conversión debajo de su categoría */
    const catConv=new Map();
    Array.from(groupBy(activas.filter(x=>x.visitas>=100),x=>x.categoria)).forEach(([k,v])=>{ if(v.length>=4) catConv.set(k,median(v.map(x=>x.conv))); });
    activas.forEach(x=>{
      const ref=catConv.get(x.categoria); if(!ref||x.visitas<300) return;
      const brecha=ref-x.conv; if(brecha<=0.005) return;
      /* tope prudente: como mucho recuperar lo que ya factura hoy */
      const pot=Math.min(brecha*x.visitas*x.precio, Math.max(x.facturacion,brecha*x.visitas*x.precio*0.3));
      acciones.push({tipo:'Conversión',prioridad:pot,titulo:x.titulo,mla:x.mlaL,
        que:`Convierte ${fP(x.conv)} contra ${fP(ref)} típico de ${x.categoria}`,
        como:'Comparar precio y fotos con las que lideran la categoría, completar ficha técnica y medidas',
        impacto:pot});
    });
    /* b) publicaciones que convierten bien y tienen poco tráfico → pauta */
    const visMed=median(activas.map(x=>x.visitas));
    activas.forEach(x=>{
      if(x.conv>=0.06&&x.visitas<visMed&&x.precio>0){
        const pot=Math.min(x.conv*(visMed-x.visitas)*x.precio, Math.max(x.facturacion*2,50000));
        acciones.push({tipo:'Tráfico',prioridad:pot,titulo:x.titulo,mla:x.mlaL,
          que:`Convierte ${fP(x.conv)} con sólo ${fN(x.visitas)} visitas`,
          como:'Sumarla a Product Ads o mejorar título y atributos: ya sabemos que cuando la ven, compran',
          impacto:pot});
      }
    });
    /* c) quiebres y stock crítico según el reporte de planificación de Full */
    const F=rowsOf('full_plan');
    if(F.length){
      F.filter(x=>/sin stock|crítico|critico/i.test(x.nivel)&&num(x.ventas30)>0)
       .forEach(x=>{
         const sinStock=/sin stock/i.test(x.nivel);
         acciones.push({tipo:'Stock',prioridad:num(x.ventas30)*(sinStock?1:0.5),
           titulo:x.producto,mla:x.mla?'MLA'+x.mla:'',
           que:`${sinStock?'Sin stock en Full':'Stock crítico en Full ('+fN(x.aptas)+' unidades)'} y facturó ${fMk(x.ventas30)} en 30 días`,
           como:`Enviar ${fN(x.sugeridas)} unidades${x.limite?` antes del ${x.limite}`:''} — es la cantidad que sugiere Mercado Libre${x.clasificacion==='Estrella'?'; además es producto Estrella':''}`,
           impacto:num(x.ventas30)*(sinStock?0.5:0.2)});
       });
    } else {
      const S=rowsOf('stock');
      if(S.length){
        const stockMap=new Map(); S.forEach(x=>{ const k=mlaKey(x.mla); stockMap.set(k,(stockMap.get(k)||0)+num(x.stock_full)+num(x.stock_flex)); });
        pubs.forEach(x=>{ const st=stockMap.get(x.mla);
          if(st!=null&&st<=0&&x.unidades>0)
            acciones.push({tipo:'Stock',prioridad:x.facturacion,titulo:x.titulo,mla:x.mlaL,
              que:`Sin stock y venía vendiendo ${fN(x.unidades)} unidades`,
              como:'Reponer urgente: además de la venta perdida, ML castiga el posicionamiento',
              impacto:div(x.facturacion,30)*14});
        });
      }
    }
    /* d) fricción detectada en las preguntas */
    if(Q.length){
      const porPub=Array.from(groupBy(Q,x=>x.titulo||x.mla));
      porPub.forEach(([k,v])=>{
        if(v.length>=15&&div(v.filter(x=>x.compra).length,v.length)<0.05){
          const p=pubs.find(y=>y.titulo===k);
          acciones.push({tipo:'Preguntas',prioridad:(p?p.facturacion*0.15:v.length*1000),titulo:k,mla:p?p.mlaL:'',
            que:`${v.length} preguntas y casi ninguna termina en venta`,
            como:'La ficha no está respondiendo lo que la gente necesita: sumar tabla de medidas, fotos de detalle y aclarar compatibilidad',
            impacto:p?p.facturacion*0.15:0});
        }
      });
    }
    /* e) campañas con ROAS pobre */
    const ads=adsUnificado();
    if(ads.length){
      const camp=Array.from(sumBy(ads.filter(x=>x.campana),x=>x.campana,['inversion','ingresos']).values());
      camp.forEach(x=>{ const roas=div(x.ingresos,x.inversion);
        if(x.inversion>50000&&roas<2)
          acciones.push({tipo:'Pauta',prioridad:x.inversion,titulo:x._k,mla:'',
            que:`ROAS ${fX(roas)} con ${fMk(x.inversion)} invertidos`,
            como:'Bajar presupuesto o pausar hasta revisar la publicación de destino',
            impacto:x.inversion*0.5});
      });
    }
    acciones.sort((a,b)=>b.prioridad-a.prioridad);
    const impactoTotal=sum(acciones,x=>x.impacto);
    view.appendChild(kpiRow([
      {l:'Acciones sugeridas',ic:'🧠',v:fN(acciones.length),s:'ordenadas por impacto estimado',hl:true},
      {l:'Facturación en juego',ic:'💰',v:fMk(impactoTotal),s:'estimación prudente, acotada por lo que ya factura cada publicación'},
      {l:'De conversión',ic:'🛒',v:fN(acciones.filter(x=>x.tipo==='Conversión').length)},
      {l:'De tráfico',ic:'📣',v:fN(acciones.filter(x=>x.tipo==='Tráfico').length)},
      {l:'De stock',ic:'📦',v:fN(acciones.filter(x=>x.tipo==='Stock').length),inv:true},
      {l:'De atención',ic:'💬',v:fN(acciones.filter(x=>x.tipo==='Preguntas').length),inv:true}
    ]));
    if(!acciones.length){ view.appendChild(card('Sin sugerencias',null,alertBox([]))); return view; }
    view.appendChild(card('Las 5 primeras','Por dónde empezar esta semana',
      alertBox(acciones.slice(0,5).map(x=>({lvl:x.tipo==='Stock'?'crit':'warn',
        t:`${x.titulo.slice(0,70)} — ${x.que}`,
        d:`${x.como}. Impacto estimado: <b>${fMk(x.impacto)}</b>`})))));
    view.appendChild(dataTable({id:'sug_plan',title:'Todas las sugerencias',
      filters:[{k:'tipo',label:'Tipo',options:['Conversión','Tráfico','Stock','Preguntas','Pauta']}],
      cols:[{k:'tipo',l:'Tipo',t:'pill',render:r=>`<span class="pill ${r.tipo==='Stock'?'p-crit':r.tipo==='Pauta'?'p-warn':'p-info'}">${esc(r.tipo)}</span>`},
        {k:'titulo',l:'Publicación / campaña'},{k:'mla',l:'MLA'},{k:'que',l:'Qué detecté'},{k:'como',l:'Qué hacer'},
        {k:'impacto',l:'Impacto estimado',t:'money',total:'sum'}],
      rows:acciones,sort:{k:'impacto',dir:'desc'},totals:true,searchKeys:['titulo','que','como','tipo'],csvName:'sugerencias'}));
  }
  return view;
}
/* =========================================================================
   APP · navegación, sincronización y arranque
   ========================================================================= */
const VIEWS={resumen:viewResumen,atencion:viewAtencion,marketing:viewMarketing,catalogo:viewCatalogo,
             comercial:viewComercial,logistica:viewLogistica,negocio:viewNegocio,sugerencias:viewSugerencias};

function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  SECTORES.forEach(s=>{
    const filas=s.datasets.reduce((a,k)=>a+rowsOf(k).length,0);
    const b=el('button',(UI.sector===s.id?'active':'')+(s.derivado||filas?'':' empty'),
      `<span class="ic">${s.ic}</span>${esc(s.nom)}`+(s.derivado?'':`<span class="badge">${filas?fNk(filas):'0'}</span>`));
    b.onclick=()=>{ UI.sector=s.id; location.hash=s.id; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    nav.appendChild(b);
  });
}
function render(){
  killCharts();
  UI._fmax=undefined;      /* se recalcula la fecha tope global por si entraron datos nuevos */
  renderNav();
  const v=$('#view'); v.innerHTML='';
  try{ v.appendChild((VIEWS[UI.sector]||viewResumen)()); }
  catch(e){ console.error(e); v.appendChild(card('Ocurrió un error al armar esta vista',null,
    `<p>${esc(e.message)}</p><p style="color:var(--muted);font-size:12.5px">Probá volver a cargar el Excel de este sector. Si el problema sigue, revisá que el archivo tenga el formato original del reporte.</p>`)); }
}

/* ------------------------------ diálogos ------------------------------ */
const SQL_TABLA=`create table if not exists gh_reportes (
  clave       text primary key,
  sector      text,
  etiqueta    text,
  filas       jsonb,
  meta        jsonb,
  origen      text,
  autor       text,
  rev         bigint      default 0,
  actualizado timestamptz default now()
);
alter table gh_reportes add column if not exists rev bigint default 0;
alter table gh_reportes enable row level security;
create policy "gh_reportes acceso" on gh_reportes
  for all using (true) with check (true);`;

function dlgSync(){
  const seg=SB.lastOk?Math.round((Date.now()-SB.lastOk)/1000):null;
  dialog('Sincronización con el equipo',
    `<p style="margin-top:0">Cuando está conectada, cada Excel que carga alguien queda disponible para todos: la app revisa el servidor cada 20 segundos y baja sólo lo que cambió.</p>
     <div style="display:grid;gap:9px;margin:12px 0">
       <label style="font-size:12.5px;font-weight:600">Tu nombre <span style="font-weight:400;color:var(--muted)">— para que el resto vea quién cargó cada reporte</span>
         <input id="sbN" type="text" value="${esc(DB.meta.user||'')}" placeholder="Ej: Lucas" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;margin-top:4px"></label>
       <label style="font-size:12.5px;font-weight:600">URL del proyecto Supabase
         <input id="sbU" type="text" value="${esc(DB.cfg.url||'')}" placeholder="https://xxxx.supabase.co" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;margin-top:4px"></label>
       <label style="font-size:12.5px;font-weight:600">Clave pública (anon)
         <input id="sbK" type="password" value="${esc(DB.cfg.key||'')}" placeholder="eyJ..." style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;margin-top:4px"></label>
     </div>
     <p style="font-size:12.5px;color:var(--ink2);margin-bottom:6px"><b>Una sola vez:</b> creá la tabla en el editor SQL de Supabase.</p>
     <code class="sql">${esc(SQL_TABLA)}</code>
     <p style="font-size:12px;color:var(--muted);margin-bottom:0">Estado: ${SB.on?(SB.err?'<b style="color:var(--crit)">con error</b>':'conectada'):'sin configurar'}${seg!=null?' · última verificación hace '+seg+' s':''}${SB.err?'<br>Último error: '+esc(SB.err.slice(0,180)):''}</p>`,
    [{t:'Cerrar'},
     {t:'Trabajar solo local',fn:()=>{ DB.cfg={url:'',key:''}; saveCfg(); clearInterval(SYNC.timer); estadoSync(); toast('Modo local'); }},
     {t:'Guardar y conectar',cls:'primary',fn:(b)=>{
        DB.meta.user=$('#sbN',b).value.trim(); 
        DB.cfg={url:$('#sbU',b).value.trim().replace(/\/$/,''),key:$('#sbK',b).value.trim()}; saveCfg(); saveLocal();
        arrancarSync();
        sync(false).then(()=>{ render(); if(SB.faltaTabla) toast('Falta crear la tabla gh_reportes en Supabase',true); });
     }}]);
}
function dlgDatos(){
  let h='<p style="margin-top:0;color:var(--ink2)">Qué hay cargado hoy en cada sector.</p>';
  SECTORES.forEach(s=>{
    h+=`<div style="margin:12px 0 4px;font-weight:700;font-size:13px">${s.ic} ${esc(s.nom)}</div>`;
    s.datasets.forEach(k=>{ const i=dsInfo(k); const d=DATASETS[k];
      h+=`<div class="ds-row"><span class="nm"><b>${esc(d.label)}</b><br><span class="st">${esc(d.desc)}</span></span>
        <span class="st">${i?`${fN(i.rows.length)} filas<br>${fDT(i.ts)}${i.src?'<br>'+esc(i.src.slice(0,28)):''}`:'—'}</span>
        ${i?`<button class="btn sm" data-del="${k}">Borrar</button>`:''}</div>`;
    });
  });
  const d=dialog('Estado de los datos',h,[{t:'Cerrar'},{t:'Exportar respaldo (JSON)',fn:()=>{
      const blob=new Blob([JSON.stringify({datasets:DB.datasets,history:DB.history},null,1)],{type:'application/json'});
      const a=el('a'); a.href=URL.createObjectURL(blob); a.download='ganga_control_respaldo.json'; a.click();
    }}]);
  $$('[data-del]',d).forEach(b=>b.onclick=()=>{
    const k=b.dataset.del;
    if(!confirm('¿Borrar "'+DATASETS[k].label+'"? Se borra para todo el equipo la próxima vez que sincronicen.')) return;
    delete DB.datasets[k]; saveLocal();
    if(SB.on) SB.remove(k).catch(e=>toast('No se pudo borrar en el servidor: '+e.message,true));
    b.closest('.ds-row').remove(); render(); toast('Conjunto borrado');
  });
}
function dlgHist(){
  const h=DB.history.length? DB.history.map(x=>`<div class="ds-row"><span class="nm"><b>${esc(x.label)}</b><br><span class="st">${esc(x.src||'')}</span></span>
      <span class="st">${fN(x.rows)} filas<br>${fDT(x.ts)}</span></div>`).join('')
    : '<div class="empty">Todavía no hay cargas registradas.</div>';
  dialog('Historial de cargas',h,[{t:'Cerrar'}]);
}

function dlgGuia(){
  const filas=[
    ['📈 Resumen Ejecutivo','<b>Resultados ML.xlsx</b> (hojas “Ventas” y “Base ventas”) o el Excel de <b>Análisis de Publicaciones</b>','Ventas por día, por provincia y ranking de productos, con comparación contra el período anterior'],
    ['💬 Atención al Cliente','<b>Resultados ML.xlsx</b>: “Base de preguntas” y “Base de Cancelaciones + Reclamos”','Volumen de preguntas, horarios, tiempo de respuesta, motivos y casos de postventa'],
    ['📣 Marketing','<b>Seguimiento de Pauta.xlsx</b> (hoja “Datos”), <b>Perfo Campañas.xlsx</b> (“Datos DSP Diario” y “PADS”) y la hoja “Datos” de Resultados ML','Inversión, ROAS, ACOS y alertas por campaña; las tres fuentes se unifican sin duplicar'],
    ['🏷️ Catálogo','<b>Análisis de Publicaciones.xlsx</b>: “Publicaciones GH” y “Publicaciones con Ventas GH”','Visitas, conversión, precio y oportunidades concretas por publicación'],
    ['💰 Comercial','El Excel de <b>costos por producto</b> (SKU, MLA, IVA%, Costo s/IVA, Costo c/IVA). Opcional: la plantilla comercial para stock y promociones','Margen real por publicación (precio real de venta − retención de ML − costo c/IVA), rotación, promociones y clasificación ABC'],
    ['📦 Logística','El <b>Reporte de Planificación</b> de Full (stock, en camino y sugerencia de ML). Sumá el export de <b>Publicaciones</b> si querés ver también el depósito propio de Flex','Stock en Full, nivel por producto, días de cobertura, facturación en riesgo y la lista de qué enviar a Full con volumen y fecha límite'],
    ['🔍 Análisis de Negocio','<b>Análisis de Publicaciones.xlsx</b>: hojas del competidor (DB)','Comparación de ingresos, unidades, ticket y rubros contra la competencia'],
    ['🧠 Sugerencias','No necesita archivo propio: usa todo lo que ya cargaron los demás sectores','Pronóstico de ventas, segmentación del catálogo, días fuera de lo normal y un plan de acción ordenado por impacto en pesos']
  ];
  dialog('Cómo se usa',
    `<p style="margin-top:0">Cada sector se actualiza cargando su Excel con el botón amarillo <b>Cargar Excel</b>. Podés arrastrar varios archivos juntos: la app mira todas las hojas, te dice qué reconoció y vos confirmás.</p>
     <p style="font-size:12.5px;color:var(--ink2)"><b>Importante:</b> mantené siempre el mismo formato de los reportes. Los datos nuevos se suman a los viejos (mismo día o misma publicación se pisan con lo último), así que podés cargar mes a mes.</p>
     <p style="font-size:12.5px;color:var(--ink2)">En todas las tablas: clic en el encabezado para ordenar de mayor a menor, otro clic para invertir. Buscador y filtros arriba, y botón CSV para bajar lo que estás viendo.</p>
     <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px">
      ${filas.map(f=>`<tr><td style="padding:7px 8px 7px 0;border-bottom:1px solid var(--grid);white-space:nowrap;vertical-align:top"><b>${f[0]}</b></td>
        <td style="padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top">${f[1]}<br><span style="color:var(--muted)">${f[2]}</span></td></tr>`).join('')}
     </table>`,
    [{t:'Entendido',cls:'primary'}]);
}

/* ------------------------------ arranque ------------------------------ */
function wire(){
  $('#syncBtn').onclick=dlgSync;
  $('#btnData').onclick=dlgDatos;
  $('#btnHist').onclick=dlgHist;
  $('#btnGuia').onclick=dlgGuia;
  $('#btnRefresh').onclick=()=>sync(false);
  $('#filePick').onchange=e=>{ importFiles(e.target.files); e.target.value=''; };
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); document.body.classList.add('dragging'); }));
  ['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); if(ev==='drop'&&e.dataTransfer.files.length) importFiles(e.dataTransfer.files); }));
  window.addEventListener('hashchange',()=>{ const h=location.hash.replace('#',''); if(VIEWS[h]&&h!==UI.sector){ UI.sector=h; render(); } });
}
async function init(){
  loadLocal();
  const h=location.hash.replace('#',''); if(VIEWS[h]) UI.sector=h;
  wire(); render(); estadoSync();
  if(!SB.on) await autoDetectSupabase();
  if(SB.on){
    setSync('on','Sincronizando…');
    await sync(true);
    arrancarSync();
    if(SB.faltaTabla) setTimeout(()=>dialog('Falta un paso para trabajar en equipo',
      `<p style="margin-top:0">Encontré la conexión a Supabase, pero todavía no existe la tabla <b>gh_reportes</b>, así que por ahora cada computadora ve sólo sus propios datos.</p>
       <p style="font-size:12.5px;color:var(--ink2)">Copiá esto en el editor SQL de Supabase y dale Run. Es una sola vez para todo el equipo.</p>
       <code class="sql">${esc(SQL_TABLA)}</code>`,[{t:'Después',},{t:'Ya lo hago',cls:'primary',fn:()=>sync(false)}]),900);
    else if(!DB.meta.user) setTimeout(()=>toast('Poné tu nombre en el botón de sincronización para que el equipo sepa quién carga cada reporte'),1200);
  } else estadoSync();
  if(!Object.keys(DB.datasets).length) setTimeout(()=>toast('Empezá cargando un Excel con el botón amarillo ⬆️'),700);
}
init();

</script>
