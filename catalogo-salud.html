<!DOCTYPE html>
<!-- VERSION catalogo v6-excel (datos: export Publicaciones 2026-10-23, refresco completo) -->
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salud del Catálogo · Ganga Home</title>
<style>
:root{--ink:#13211d;--bg:#f4f2ea;--card:#fff;--line:#e3ded0;--mut:#7a7565;
--red:#d83a2b;--amber:#e0a008;--green:#1f8a5b;--blue:#2563c9;--accent:#e8552d;--purple:#7c5cbf;
--sh:0 1px 2px rgba(19,33,29,.04),0 6px 20px rgba(19,33,29,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.app{max-width:1340px;margin:0 auto;padding:0 18px 70px}
header{background:var(--ink);color:#f1ede1;padding:15px 0}
header .in{max-width:1340px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px}
header b{font-size:16px}header span.sub{font-size:11px;color:#9bb0a6;text-transform:uppercase;letter-spacing:2px}
.spacer{flex:1}
.statepill{font-size:11.5px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.09);color:#cfe0d7;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12)}
.dot{width:7px;height:7px;border-radius:50%;background:#9bb0a6}.dot.live{background:var(--green)}.dot.err{background:var(--red)}.dot.load{background:var(--amber)}
button{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.12s}
button:hover{box-shadow:var(--sh)}button.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.topbtn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}

.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.stat .v{font-size:27px;font-weight:750;margin-top:5px;line-height:1}
.stat .s{font-size:12px;color:var(--mut);margin-top:3px}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.stat.red::before{background:var(--red)}.stat.amber::before{background:var(--amber)}.stat.green::before{background:var(--green)}.stat.purple::before{background:var(--purple)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
.xbtn{border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:600;background:var(--card);cursor:pointer}
.xbtn:hover{box-shadow:var(--sh)}
.toolbar input[type=search]{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;min-width:240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:none;border-radius:0;padding:9px 13px;font-size:12.5px}
.seg button.on{background:var(--ink);color:#fff}
.cnt{font-size:12.5px;color:var(--mut)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.card .top{display:flex;gap:12px;padding:14px 15px 10px}
.scorewrap{flex-shrink:0;width:58px;height:58px;position:relative}
.scorewrap svg{transform:rotate(-90deg)}
.scorewrap .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:750}
.card .meta{min-width:0;flex:1}
.card .ttl{font-size:13px;font-weight:650;line-height:1.3;max-height:2.6em;overflow:hidden}
.card .mla{font-size:11px;color:var(--mut);font-family:ui-monospace,monospace;margin-top:3px}
.mllink{font-family:Inter,sans-serif;color:var(--blue);text-decoration:none;font-weight:600;font-size:10.5px;margin-left:6px;white-space:nowrap}
.mllink:hover{text-decoration:underline}
.card .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#ece6d4;color:var(--mut)}
.tag.gx{background:#efe2da;color:#a3502d}
.crit{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.crit .c{background:var(--card);padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:12px;cursor:default}
.crit .c.manual{cursor:pointer;user-select:none}
.crit .c.manual:hover{background:#faf8f1}
.ind{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--line)}
.ind.g{background:var(--green)}.ind.a{background:var(--amber)}.ind.r{background:var(--red)}
.crit .c .lbl{flex:1;color:var(--ink)}
.crit .c .val{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.crit .c.manual.done .lbl{color:var(--green);font-weight:600}
.crit .c .chk{width:16px;height:16px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.crit .c.manual.done .chk{background:var(--green);border-color:var(--green)}
.auto-badge{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.notes{padding:10px 13px 12px;border-top:1px solid var(--line);background:#fcfbf6}
.notes-head{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.notes-head .has-note{color:var(--accent);font-size:9px}
.note-ta{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12px;resize:vertical;min-height:38px;background:var(--card);color:var(--ink);line-height:1.4}
.note-ta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,201,.1)}

.empty{padding:60px 20px;text-align:center;color:var(--mut)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:0 0 14px;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}

/* secciones por estado */
.estsection{margin:0 0 26px}
.estsection-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.estsection-head h3{margin:0;font-size:15px;font-weight:700}
.estcount{font-size:12px;font-weight:700;background:var(--ink);color:#fff;padding:2px 9px;border-radius:999px}
.est-section-prog .estsection-head h3{color:var(--blue)}
.est-section-opt .estsection-head h3{color:var(--green)}
.estsection-empty{padding:18px;text-align:center;color:var(--mut);font-size:12.5px;background:#faf8f1;border:1px dashed var(--line);border-radius:12px}

/* borde de color de tarjeta según estado */
.card.est-prog{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),var(--sh)}
.card.est-opt{border-color:var(--green);opacity:.92}
.card{position:relative}

/* barra de botones de estado */
.estbar{display:flex;gap:8px;padding:10px 13px;border-top:1px solid var(--line);background:#faf8f1;flex-wrap:wrap}
.estbtn{font-size:12px;font-weight:600;border-radius:8px;padding:7px 12px;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.estbtn.start{background:var(--blue);color:#fff;border-color:var(--blue);flex:1}
.estbtn.done{background:var(--green);color:#fff;border-color:var(--green);flex:1}
.estbtn.reopen{background:var(--card);color:var(--blue);border-color:var(--blue);flex:1}
.estbtn.ghost{color:var(--mut)}
.estbtn:hover{box-shadow:var(--sh)}

/* botón foco en la esquina de la tarjeta */
.top{position:relative}
.focusbtn{position:absolute;top:0;right:0;background:none;border:none;color:var(--mut);font-size:15px;cursor:pointer;padding:2px 4px;line-height:1}
.focusbtn:hover{color:var(--blue)}

/* modo foco (modal) */
.focus-layer{position:fixed;inset:0;background:rgba(19,33,29,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.focus-box{background:var(--bg);border-radius:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.focus-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
.fnav{font-size:12.5px;padding:7px 12px}.fnav:disabled{opacity:.4;cursor:default}
.fpos{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.fclose{font-size:12.5px;background:var(--ink);color:#fff;border-color:var(--ink);padding:7px 13px}
.focus-card{padding:14px}
.focus-card .card{border-radius:14px}
.focus-card .crit .c{padding:12px 14px;font-size:13px}
.focus-card .note-ta{min-height:70px}
</style></head>

<header><div class="in">
  <div><b>Salud del Catálogo</b><br><span class="sub">Ganga Home · v6 · datos 23/10/2026</span></div>

<div class="app">

  <div class="legend">

      <button data-e="todas">Todas</button>
    </div>
    <div class="seg" id="filterSeg">
      <button class="on" data-f="all">Todos</button>
      <button data-f="crit">Críticos &lt;50</button>
      <button data-f="manual">Falta revisar</button>
      <button data-f="promo">Con promo</button>
      <button data-f="notas">Con notas</button>
    </div>
    <button class="xbtn" id="btnExport" title="Descargar Excel con SKU, nombre y todas las validaciones en columnas">⬇ Excel</button>
    <span class="cnt" id="cnt"></span>
  </div>

  <div id="grid"></div>
  <div class="empty" id="empty" style="display:none">Sin resultados.</div>
</div>

<div id="focusLayer" class="focus-layer" style="display:none">
  <div class="focus-box">
    <div class="focus-bar">
      <button id="focusPrev" class="fnav">← Anterior</button>
      <span id="focusPos" class="fpos"></span>
      <button id="focusNext" class="fnav">Siguiente →</button>
      <span style="flex:1"></span>
      <button id="focusClose" class="fclose">Cerrar ✕</button>
    </div>
    <div id="focusCard" class="focus-card"></div>
  </div>
</div>

try{const r=localStorage.getItem(NK);if(r)NOTAS=JSON.parse(r);}catch(e){}
const saveNotas=()=>{try{localStorage.setItem(NK,JSON.stringify(NOTAS))}catch(e){}};
function getNota(mla){return NOTAS[mla]||'';}
function setNota(mla,txt){if(txt&&txt.trim()){NOTAS[mla]=txt;}else{delete NOTAS[mla];}saveNotas();SUPA.pushEstado(mla);}

// ===== estado de trabajo por publicación (kanban) =====
const EK='gh_catalogo_estado_v1';
let ESTADO={}; // {mla:'sin'|'prog'|'opt'} ; default 'sin'
try{const r=localStorage.getItem(EK);if(r)ESTADO=JSON.parse(r);}catch(e){}
const saveEstado=()=>{try{localStorage.setItem(EK,JSON.stringify(ESTADO))}catch(e){}};
function getEstado(mla){return ESTADO[mla]||'sin';}
function setEstado(mla,st){if(st==='sin'){delete ESTADO[mla];}else{ESTADO[mla]=st;}saveEstado();SUPA.pushEstado(mla);renderHero();render();}

// ===== evaluación de criterios =====
// cada criterio devuelve {state:'g'|'a'|'r', val:'texto', pts:0..1}
function evalStock(p){
 if(p.stock<=0)return{state:'r',val:'sin stock',pts:0};
 if(p.stock<=5)return{state:'r',val:fmt(p.stock)+' u · crítico',pts:.2};
 if(p.stock<=20)return{state:'a',val:fmt(p.stock)+' u · bajo',pts:.5};
 return{state:'g',val:fmt(p.stock)+' u',pts:1};
}
function evalLog(p){
 if(p.full>0&&p.flex>0)return{state:'g',val:'Full '+fmt(p.full)+' + Flex '+fmt(p.flex),pts:1};
 if(p.full>0)return{state:'g',val:'Full '+fmt(p.full)+' u',pts:1};
 if(p.flex>0)return{state:'a',val:'solo Flex '+fmt(p.flex)+' u',pts:.5};
 return{state:'r',val:'sin stock en ningún canal',pts:0};
}
function evalPrecio(p){
 /* 9.999.999 es el relleno que pone ML cuando la publicación quedó sin precio */
 if(p.precio<=0||p.precio>=9999999)return{state:'r',val:'sin precio',pts:0};
 if(p.promo>0&&p.promo<p.precio){
  const d=1-p.promo/p.precio;
  return d>.5
   ? {state:'a',val:'$'+fmt(p.promo)+' · −'+fmt(d*100)+'% sobre $'+fmt(p.precio),pts:.6}
   : {state:'g',val:'$'+fmt(p.promo)+' · −'+fmt(d*100)+'%',pts:1};
 }
 return{state:'g',val:'$'+fmt(p.precio),pts:1};
}
function compute(){
 DATA.forEach(p=>{
  const c=getChk(p.mla);
  const stock=evalStock(p),log=evalLog(p),precio=evalPrecio(p);
  // manuales: hecho=1, sin hacer=0 (rojo si no, verde si sí)
  const man=k=>({state:c[k]?'g':'r',val:c[k]?'✓ revisado':'pendiente',pts:c[k]?1:0,done:c[k]});
  const titulo=man('titulo'),desc=man('desc'),fotos=man('fotos'),clip=man('clip');
  p.crit={stock,log,precio,titulo,desc,fotos,clip};
  const all=[stock,log,precio,titulo,desc,fotos,clip];
  p.score=Math.round(all.reduce((a,x)=>a+x.pts,0)/all.length*100);
  p.pending=[titulo,desc,fotos,clip].filter(x=>!x.done).length;
 });
}

// ===== render =====
function scoreColor(s){return s>=80?'var(--green)':s>=50?'var(--amber)':'var(--red)';}
function ring(score){
 const r=24,c=2*Math.PI*r,off=c*(1-score/100);
 return '<div class="scorewrap"><svg width="58" height="58" viewBox="0 0 58 58">'
  +'<circle cx="29" cy="29" r="'+r+'" fill="none" stroke="#ece6d4" stroke-width="5"/>'
  +'<circle cx="29" cy="29" r="'+r+'" fill="none" stroke="'+scoreColor(score)+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
  +'</svg><div class="num" style="color:'+scoreColor(score)+'">'+score+'</div></div>';
}
function critRow(label,r,auto,mla,key,full){
 const fc=full?' style="grid-column:1/-1"':'';
 if(auto){
  return '<div class="c"'+fc+'><span class="ind '+r.state+'"></span><span class="lbl">'+label+'</span><span class="val">'+r.val+'</span></div>';
 }
 // manual: clickeable
 return '<div class="c manual'+(r.done?' done':'')+'"'+fc+' data-mla="'+mla+'" data-key="'+key+'">'
  +'<span class="chk">'+(r.done?'✓':'')+'</span><span class="lbl">'+label+'</span></div>';
}
let sortMode='score-asc',filterMode='all',estadoFilter='act',q='';
function cardHTML(p){const c=p.crit;const est=getEstado(p.mla);
 const estBtns=
  '<div class="estbar">'
  +(est==='sin'?'<button class="estbtn start" data-mla="'+p.mla+'" data-to="prog">▶ Empezar a trabajar</button>':'')
  +(est==='prog'?'<button class="estbtn done" data-mla="'+p.mla+'" data-to="opt">✓ Marcar optimizada</button>'
     +'<button class="estbtn ghost" data-mla="'+p.mla+'" data-to="sin">Volver a sin empezar</button>':'')
  +(est==='opt'?'<button class="estbtn reopen" data-mla="'+p.mla+'" data-to="prog">↩ Reabrir</button>':'')
  +'</div>';
 return '<div class="card est-'+est+'" data-mla="'+p.mla+'"><div class="top">'+ring(p.score)
   +'<div class="meta"><div class="ttl">'+esc(p.titulo)+'</div>'
   +'<div class="mla">'+p.mla+' <a class="mllink" href="'+p.link+'" target="_blank" rel="noopener" title="Abrir publicación en Mercado Libre">Ver en ML ↗</a></div>'
   +'<div class="tags"><span class="tag '+(CAT(p.tramo)==='gx'?'gx':'')+'">'+FEEL[p.tramo]+'</span>'
     +(p.estadoPub==='ina'?'<span class="tag" style="background:#ece6d4;color:#7a7565">Inactiva</span>':'<span class="tag" style="background:#dcf0e6;color:var(--green)">Activa</span>')
     +(p.envio==='gratis'?'<span class="tag" style="background:#e2ecfb;color:var(--blue)">Envío gratis</span>':'')
     +(p.cuotas?'<span class="tag" style="background:#efe7fb;color:var(--purple)">Cuotas</span>':'')
     +(p.nvar?'<span class="tag">'+p.nvar+' var.</span>':'')
     +(p.pending?'<span class="tag" style="background:#fbe5e2;color:var(--red)">'+p.pending+' pendiente'+(p.pending>1?'s':'')+'</span>':'<span class="tag" style="background:#dcf0e6;color:var(--green)">todo tildado</span>')
   +'</div></div>'
   +'<button class="focusbtn" data-mla="'+p.mla+'" title="Abrir en modo foco">⛶</button>'
   +'</div>'
   +'<div class="crit">'
    +critRow('Stock',c.stock,true)
    +critRow('Logística',c.log,true)
    +critRow('Precio',c.precio,true)
    +critRow('Título',c.titulo,false,p.mla,'titulo')
    +critRow('Ficha técnica',c.desc,false,p.mla,'desc')
    +critRow('Fotos',c.fotos,false,p.mla,'fotos')
    +critRow('Clip / Video',c.clip,false,p.mla,'clip',true)
   +'</div>'
   +'<div class="notes">'
    +'<div class="notes-head"><span>📝 Notas</span>'+(getNota(p.mla)?'<span class="has-note">●</span>':'')+'</div>'
    +'<textarea class="note-ta" data-mla="'+p.mla+'" placeholder="Pendientes, observaciones, recordatorios…">'+esc(getNota(p.mla))+'</textarea>'
   +'</div>'
   +estBtns
   +'</div>';
}
function filterRows(){
 let rows=DATA.slice();
 if(estadoFilter!=='todas')rows=rows.filter(p=>p.estadoPub===estadoFilter);
 if(q){const s=q.toLowerCase();rows=rows.filter(p=>(p.mla+' '+p.titulo+' '+(p.sku||'')).toLowerCase().includes(s));}
 if(filterMode==='crit')rows=rows.filter(p=>p.score<50);
 if(filterMode==='manual')rows=rows.filter(p=>p.pending>0);
 if(filterMode==='promo')rows=rows.filter(p=>p.promo>0&&p.promo<p.precio);
 if(filterMode==='notas')rows=rows.filter(p=>getNota(p.mla).trim());
 if(sortMode==='score-asc')rows.sort((a,b)=>a.score-b.score);
 else if(sortMode==='score-desc')rows.sort((a,b)=>b.score-a.score);
 else rows.sort((a,b)=>b.pending-a.pending||a.score-b.score);
 return rows;
}
const COLS=[['prog','🔧 En progreso'],['sin','⚪ Sin empezar'],['opt','✅ Optimizadas']];
function render(){
 const rows=filterRows();
 $('#cnt').textContent=rows.length+' de '+DATA.length+' publicaciones';
 // agrupar por estado
 const byEst={sin:[],prog:[],opt:[]};
 rows.forEach(p=>byEst[getEstado(p.mla)].push(p));
 let html='';
 for(const [key,label] of COLS){
  const list=byEst[key];
  html+='<div class="estsection est-section-'+key+'">'
   +'<div class="estsection-head"><h3>'+label+'</h3><span class="estcount">'+list.length+'</span></div>';
  if(list.length){
   html+='<div class="grid">'+list.map(cardHTML).join('')+'</div>';
  }else{
   html+='<div class="estsection-empty">'+(key==='prog'?'Tocá “Empezar a trabajar” en una publicación para traerla acá.':key==='opt'?'Todavía no marcaste ninguna como optimizada.':'Nada pendiente acá.')+'</div>';
  }
  html+='</div>';
 }
 $('#grid').innerHTML=html;
 $('#empty').style.display=rows.length?'none':'block';
 wireCards();
}
function wireCards(){
 $$('.note-ta').forEach(t=>{
  t.onblur=()=>{const mla=t.dataset.mla;setNota(mla,t.value);
   const head=t.closest('.notes').querySelector('.notes-head');const had=head.querySelector('.has-note');
   if(t.value.trim()&&!had){head.insertAdjacentHTML('beforeend','<span class="has-note">●</span>');}
   else if(!t.value.trim()&&had){had.remove();}};
 });
 $$('.c.manual').forEach(el=>el.onclick=()=>toggleChkInPlace(el));
 $$('.estbtn').forEach(b=>b.onclick=()=>setEstado(b.dataset.mla,b.dataset.to));
 $$('.focusbtn').forEach(b=>b.onclick=()=>openFocus(b.dataset.mla));
}
// tildar SIN re-render global: actualiza solo la tarjeta in-place (no se mueve)
function toggleChkInPlace(el){
 const mla=el.dataset.mla,key=el.dataset.key;
 const c=getChk(mla);c[key]=!c[key];CHECKS[mla]=c;saveChecks();SUPA.pushEstado(mla);
 compute();
 const p=DATA.find(x=>x.mla===mla);
 // actualizar visualmente la celda y el anillo de ESTA tarjeta, sin tocar el orden
 el.classList.toggle('done',c[key]);
 el.querySelector('.chk').textContent=c[key]?'✓':'';
 const card=el.closest('.card');
 if(card&&p){
  const sw=card.querySelector('.scorewrap');if(sw)sw.outerHTML=ring(p.score);
  const tagWrap=card.querySelector('.tags');
  if(tagWrap){const pendTag=tagWrap.querySelector('.tag:last-child');
   if(pendTag)pendTag.outerHTML=(p.pending?'<span class="tag" style="background:#fbe5e2;color:var(--red)">'+p.pending+' pendiente'+(p.pending>1?'s':'')+'</span>':'<span class="tag" style="background:#dcf0e6;color:var(--green)">todo tildado</span>');}
 }
 // si hay un panel de foco abierto para este mla, refrescarlo
 if(FOCUS===mla)renderFocus();
 renderHero();
}
function renderHero(){
 const base=estadoFilter==='todas'?DATA:DATA.filter(p=>p.estadoPub===estadoFilter);
 const n=base.length;
 const avg=n?Math.round(base.reduce((a,p)=>a+p.score,0)/n):0;
 const crit=base.filter(p=>p.score<50).length;
 const pend=base.reduce((a,p)=>a+p.pending,0);
 const optimos=base.filter(p=>p.score>=80).length;
 const sinStock=base.filter(p=>p.stock<=0).length;
 const act=DATA.filter(p=>p.estadoPub==='act').length;
 const st=(c,l,v,s)=>'<div class="stat '+c+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';
 const et=estadoFilter==='act'?'activas':estadoFilter==='ina'?'inactivas':'publicaciones';
 $('#hero').innerHTML=
   st(avg>=80?'green':avg>=50?'amber':'red','Salud promedio',avg+'<span style="font-size:15px;color:var(--mut)">/100</span>',n+' '+et+(estadoFilter==='todas'?' ('+act+' activas)':' de '+DATA.length))
  +st('green','Óptimas',fmt(optimos),'≥80 de salud')
  +st(crit?'red':'green','Críticas',fmt(crit),'<50 de salud')
  +st(sinStock?'red':'green','Sin stock',fmt(sinStock),'0 u en Full y Flex')
  +st(pend?'amber':'green','Revisiones pendientes',fmt(pend),'título/ficha/fotos/clip sin tildar')
  +st('purple','Catálogo cubierto',n?Math.round((n-base.filter(p=>p.pending===4).length)/n*100)+'%':'0%','con al menos 1 check');
}

// ===== MODO FOCO =====
let FOCUS=null;
function openFocus(mla){FOCUS=mla;renderFocus();document.body.style.overflow='hidden';}
function closeFocus(){FOCUS=null;$('#focusLayer').style.display='none';document.body.style.overflow='';render();}
function renderFocus(){
 const p=DATA.find(x=>x.mla===FOCUS);if(!p)return;
 const layer=$('#focusLayer');layer.style.display='flex';
 $('#focusCard').innerHTML=cardHTML(p);
 // re-enganchar handlers dentro del foco
 const fc=$('#focusCard');
 fc.querySelectorAll('.c.manual').forEach(el=>el.onclick=()=>toggleChkInPlace(el));
 fc.querySelectorAll('.estbtn').forEach(b=>b.onclick=()=>{setEstado(b.dataset.mla,b.dataset.to);renderFocus();});
 fc.querySelectorAll('.focusbtn').forEach(b=>b.remove()); // no hace falta dentro del foco
 fc.querySelectorAll('.note-ta').forEach(t=>{t.onblur=()=>{setNota(t.dataset.mla,t.value);};});
 // navegación: anterior/siguiente dentro del orden actual
 const rows=filterRows();const idx=rows.findIndex(x=>x.mla===FOCUS);
 $('#focusPos').textContent=(idx+1)+' / '+rows.length;
 $('#focusPrev').disabled=idx<=0;$('#focusNext').disabled=idx>=rows.length-1;
 $('#focusPrev').onclick=()=>{if(idx>0){FOCUS=rows[idx-1].mla;renderFocus();}};
 $('#focusNext').onclick=()=>{if(idx<rows.length-1){FOCUS=rows[idx+1].mla;renderFocus();}};
}

function setState(cls,txt){$('#dot').className='dot '+cls;$('#stateTxt').textContent=txt;}
async function load(){
 setState('load','Cargando…');$('#btnReload').disabled=true;
 DATA=await SUPA.load();
 try{await pullEstado();}catch(e){console.warn('sync estado no disponible',e);}
 compute();renderHero();render();
 const act=DATA.filter(p=>p.estadoPub==='act').length;
 setState('live',act+' activas · '+(DATA.length-act)+' inactivas · datos '+FECHA_DATOS);
 $('#btnReload').disabled=false;
}

// ===== export a Excel: SKU, nombre y validaciones en columnas =====
const XST={g:'OK',a:'Mejorable',r:'Atención'};
const XEST={sin:'Sin optimizar',prog:'En progreso',opt:'Optimizada'};
function exportXLSX(){
 compute();
 const rows=DATA.map(p=>{const c=p.crit||{};const chk=getChk(p.mla);return{
  'SKU':p.sku||'','MLA':p.mla,'Título':p.titulo,
  'Score salud':p.score,
  'Estado trabajo':XEST[getEstado(p.mla)]||'Sin optimizar',
  'Pendientes manuales':p.pending,
  'Estado publicación':p.estadoPub==='act'?'Activa':'Inactiva',
  'Stock (estado)':c.stock?XST[c.stock.state]:'','Stock total (u)':p.stock,
  'Stock Full':p.full,'Stock Flex':p.flex,
  'Logística (estado)':c.log?XST[c.log.state]:'','Logística (detalle)':c.log?c.log.val:'',
  'Envío':p.envio==='gratis'?'Gratis':p.envio==='comprador'?'A cargo del comprador':'No disponible',
  'Cuotas':p.cuotas?'Sí':'No','Variantes':p.nvar,
  'Precio (estado)':c.precio?XST[c.precio.state]:'','Precio de lista ($)':p.precio,
  'Precio con promo ($)':p.promo||'','% Descuento':p.promo&&p.precio?Math.round((1-p.promo/p.precio)*100):'',
  'Título revisado':chk.titulo?'Sí':'No','Descripción revisada':chk.desc?'Sí':'No',
  'Fotos revisadas':chk.fotos?'Sí':'No','Clip subido':chk.clip?'Sí':'No',
  'Tramo':FEEL[p.tramo]||p.tramo,'Nota':getNota(p.mla),'Link':p.link};});
 const hoy=new Date().toISOString().slice(0,10);
 if(typeof XLSX==='undefined'){
  const cols=Object.keys(rows[0]||{});
  const csvEsc=v=>{v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv='\ufeff'+cols.join(';')+'\n'+rows.map(r=>cols.map(k=>csvEsc(r[k])).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='catalogo-salud-'+hoy+'.csv';a.click();return;
 }
 const ws=XLSX.utils.json_to_sheet(rows);
 ws['!cols']=[{wch:12},{wch:15},{wch:52},{wch:9},{wch:13},{wch:10},{wch:16},{wch:11},{wch:13},{wch:11},{wch:11},{wch:14},{wch:24},{wch:22},{wch:8},{wch:9},{wch:12},{wch:15},{wch:16},{wch:11},{wch:11},{wch:13},{wch:16},{wch:13},{wch:10},{wch:7},{wch:30},{wch:40}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Salud catálogo');
 XLSX.writeFile(wb,'catalogo-salud-'+hoy+'.xlsx');
}
document.getElementById('btnExport').addEventListener('click',exportXLSX);

$('#btnReload').onclick=load;
$('#search').oninput=e=>{q=e.target.value;render();};
$$('#sortSeg button').forEach(b=>b.onclick=()=>{$$('#sortSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sortMode=b.dataset.s;render();});
$$('#filterSeg button').forEach(b=>b.onclick=()=>{$$('#filterSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterMode=b.dataset.f;render();});
$$('#estadoSeg button').forEach(b=>b.onclick=()=>{$$('#estadoSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');estadoFilter=b.dataset.e;renderHero();render();});
$('#focusClose').onclick=closeFocus;
$('#focusLayer').onclick=e=>{if(e.target.id==='focusLayer')closeFocus();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&FOCUS)closeFocus();
 if(FOCUS&&e.key==='ArrowRight'){$('#focusNext').click();}
 if(FOCUS&&e.key==='ArrowLeft'){$('#focusPrev').click();}});
async function pullEstado(){try{const {C,N,E}=await SUPA.fetchEstado();
 CHECKS=Object.assign({},CHECKS,C);NOTAS=Object.assign({},NOTAS,N);ESTADO=Object.assign({},ESTADO,E);
 saveChecks();saveNotas();saveEstado();}catch(e){console.warn('pull estado err',e);}}
setInterval(async()=>{const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains('note-ta'))return;try{await pullEstado();compute();renderHero();render();}catch(e){}},25000);
load();
</script>
